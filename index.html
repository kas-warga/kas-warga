<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Warga — Fully Responsive UI/UX Prototype</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Responsive States
      const [viewMode, setViewMode] = useState('responsive'); // 'responsive' | 'desktop' | 'pwa'
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      
      // Page States
      const [adminPage, setAdminPage] = useState('billing');
      const [pwaPage, setPwaPage] = useState('tagihan');
      
      // Modal & Toast States
      const [showAddIuranModal, setShowAddIuranModal] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-emerald-500 text-slate-950 font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm animate-bounce">
              <i data-lucide="check-circle-2" className="w-5 h-5"></i>
              {toast}
            </div>
          )}

          {/* Top Mode Switcher Bar */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 sm:px-6 z-30 flex-shrink-0">
            <div className="flex items-center gap-2 sm:gap-3">
              <div className="bg-emerald-500 text-slate-950 font-black rounded-lg px-2 py-0.5 text-xs tracking-wider">
                KW
              </div>
              <span className="text-xs font-semibold text-slate-300 hidden md:inline">
                Kas Warga — Mode Responsif Nyata (Mobile, Tablet, Desktop)
              </span>
            </div>

            {/* Viewport Switcher Toggle */}
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] sm:text-xs">
              <button 
                onClick={() => setViewMode('responsive')} 
                className={`flex items-center gap-1 px-2.5 py-1 rounded-lg font-medium transition ${viewMode === 'responsive' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="layout" className="w-3.5 h-3.5"></i> Responsif
              </button>
              <button 
                onClick={() => setViewMode('desktop')} 
                className={`flex items-center gap-1 px-2.5 py-1 rounded-lg font-medium transition ${viewMode === 'desktop' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="monitor" className="w-3.5 h-3.5"></i> Desktop
              </button>
              <button 
                onClick={() => setViewMode('pwa')} 
                className={`flex items-center gap-1 px-2.5 py-1 rounded-lg font-medium transition ${viewMode === 'pwa' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="smartphone" className="w-3.5 h-3.5"></i> PWA Frame
              </button>
            </div>
          </header>

          {/* Canvas Main Container */}
          <div className="flex-1 flex overflow-hidden p-2 sm:p-4 md:p-6 bg-slate-950/80 justify-center">
            
            {/* ------------------------------------------------------------- */}
            {/* 1. LAYOUT RESPONSIF (ADAPTIF OTOMATIS) / DESKTOP VIEW         */}
            {/* ------------------------------------------------------------- */}
            {(viewMode === 'responsive' || viewMode === 'desktop') && (
              <div className="w-full max-w-7xl bg-slate-100 text-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-800">
                
                {/* Responsive Browser Frame Header */}
                <div className="h-9 bg-slate-200 border-b border-slate-300 flex items-center justify-between px-4 flex-shrink-0">
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                      className="lg:hidden p-1 bg-slate-300 hover:bg-slate-400 text-slate-800 rounded-md">
                      <i data-lucide="menu" className="w-4 h-4"></i>
                    </button>
                    <div className="hidden sm:flex gap-1.5">
                      <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                      <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                      <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                  </div>
                  <div className="text-center truncate px-2">
                    <span className="bg-white/80 px-3 py-0.5 rounded-md text-[10px] sm:text-[11px] text-slate-600 font-mono border border-slate-300 truncate inline-block max-w-[200px] sm:max-w-none">
                      https://bogorvaley.my.id/admin/{adminPage}
                    </span>
                  </div>
                  <div className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">
                    RT 05 / RW 02
                  </div>
                </div>

                <div className="flex-1 flex overflow-hidden relative">
                  
                  {/* SIDEBAR NAVIGATION (RESPONSIF - OVERLAY DI MOBILE, FIXED DI DESKTOP) */}
                  <aside className={`
                    absolute lg:relative top-0 left-0 bottom-0 z-20 w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 text-xs transition-transform duration-300 ease-in-out
                    ${mobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full lg:translate-x-0'}
                  `}>
                    <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-sm">RT</div>
                        <div>
                          <h2 className="font-bold text-white text-sm">Kas Warga RT 05</h2>
                          <p className="text-[10px] text-emerald-400 font-medium">● Lisensi Aktif</p>
                        </div>
                      </div>
                      <button onClick={() => setMobileMenuOpen(false)} className="lg:hidden text-slate-400 hover:text-white">
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3 space-y-4">
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Menu Utama</p>
                        <button 
                          onClick={() => { setAdminPage('dashboard'); setMobileMenuOpen(false); }} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'dashboard' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Dashboard
                        </button>
                      </div>

                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Keuangan & Kas</p>
                        <button 
                          onClick={() => { setAdminPage('billing'); setMobileMenuOpen(false); }} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'billing' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="receipt" className="w-4 h-4"></i> Tagihan & Iuran
                        </button>
                        <button 
                          onClick={() => { setAdminPage('payments'); setMobileMenuOpen(false); }} 
                          className={`w-full flex items-center justify-between px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'payments' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span className="flex items-center gap-2.5"><i data-lucide="credit-card" className="w-4 h-4"></i> Verifikasi</span>
                          <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold">2</span>
                        </button>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400">
                      <p className="font-semibold text-white">Pak Budi (Bendahara)</p>
                      <p className="text-[10px] text-slate-500">Sesi Admin Terverifikasi</p>
                    </div>
                  </aside>

                  {/* Backdrop Overlay untuk Mobile Sidebar */}
                  {mobileMenuOpen && (
                    <div onClick={() => setMobileMenuOpen(false)} className="fixed inset-0 bg-slate-950/60 z-10 lg:hidden"></div>
                  )}

                  {/* MAIN CONTENT AREA (ADAPTIF RESPONSIF) */}
                  <main className="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
                    
                    {/* Top Search Bar */}
                    <div className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 flex-shrink-0">
                      <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl w-48 sm:w-72 text-xs">
                        <i data-lucide="search" className="w-4 h-4 text-slate-400"></i>
                        <input type="text" placeholder="Cari iuran, warga..." className="bg-transparent focus:outline-none w-full" />
                      </div>
                      <div className="flex items-center gap-3 text-xs">
                        <button onClick={() => showToast('Notifikasi')} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl relative text-slate-600">
                          <i data-lucide="bell" className="w-4 h-4"></i>
                          <span className="w-2 h-2 bg-rose-500 rounded-full absolute top-1 right-1"></span>
                        </button>
                      </div>
                    </div>

                    {/* DYNAMIC PAGE AREA */}
                    <div className="p-4 sm:p-6 space-y-6">
                      
                      {/* PAGE 1: BILLING & TAGIHAN (LENGKAP DENGAN TOMBOL TAMBAH) */}
                      {adminPage === 'billing' && (
                        <div className="space-y-6">
                          
                          {/* Title & Action Buttons (Flex Wrap Responsif) */}
                          <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                            <div>
                              <h1 className="text-lg sm:text-xl font-bold text-slate-800">Pengaturan Iuran & Tagihan</h1>
                              <p className="text-xs text-slate-500">Kelola tarif iuran bulanan, buat jenis iuran baru, dan terbitkan tagihan.</p>
                            </div>
                            
                            {/* Action Buttons */}
                            <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                              <button 
                                onClick={() => setShowAddIuranModal(true)} 
                                className="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition">
                                <i data-lucide="plus" className="w-4 h-4"></i> Tambah Jenis Iuran
                              </button>
                              <button 
                                onClick={() => showToast('Tagihan Bulanan Oktober Berhasil Di-generate!')} 
                                className="flex-1 sm:flex-initial bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition">
                                <i data-lucide="zap" className="w-4 h-4"></i> Generate Tagihan Bulanan
                              </button>
                            </div>
                          </div>

                          {/* Form Terbitkan Tagihan (Grid Responsif) */}
                          <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 text-xs">
                            <h3 className="font-bold text-slate-800 text-sm border-b pb-2 flex items-center gap-2">
                              <i data-lucide="file-plus" className="w-4 h-4 text-emerald-600"></i> Form Terbitkan Tagihan Baru
                            </h3>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4">
                              <div className="space-y-1">
                                <label className="font-bold text-slate-700">Pilih Jenis Iuran / Tarif</label>
                                <select className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800 focus:outline-none focus:border-emerald-500">
                                  <option>Iuran Keamanan & Kebersihan (Rp 75.000)</option>
                                  <option>Kas Rutin RT (Rp 50.000)</option>
                                  <option>Sumbangan PHBN 17 Agustus (Insidental)</option>
                                </select>
                              </div>

                              <div className="space-y-1">
                                <label className="font-bold text-slate-700">Periode Tagihan</label>
                                <input type="month" defaultValue="2026-10" className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800 focus:outline-none focus:border-emerald-500" />
                              </div>

                              <div className="space-y-1">
                                <label className="font-bold text-slate-700">Target Warga</label>
                                <select className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800 focus:outline-none focus:border-emerald-500">
                                  <option>Seluruh Warga Aktif (78 Rumah)</option>
                                  <option>Blok A Saja</option>
                                  <option>Blok B Saja</option>
                                </select>
                              </div>
                            </div>

                            <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 pt-2 border-t">
                              <p className="text-[11px] text-amber-700 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200">
                                ⚠️ Pencegahan tagihan ganda periode yang sama aktif.
                              </p>
                              <button 
                                onClick={() => showToast('Tagihan berhasil diterbitkan!')} 
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-sm text-center">
                                🚀 Terbitkan Tagihan Sekarang
                              </button>
                            </div>
                          </div>

                          {/* List Jenis Iuran Terdaftar */}
                          <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <div className="flex justify-between items-center border-b pb-3">
                              <h3 className="font-bold text-slate-800 text-sm">Daftar Jenis Iuran Terdaftar:</h3>
                              <span className="text-xs text-slate-500 font-medium">Total: 2 Jenis Iuran</span>
                            </div>

                            <div className="space-y-3">
                              {/* Item 1 */}
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs gap-3">
                                <div>
                                  <p className="font-bold text-slate-800 text-sm">Iuran Keamanan & Kebersihan</p>
                                  <p className="text-[11px] text-slate-500">Tipe: Rutin Bulanan | Sasaran: Seluruh Warga RT</p>
                                </div>
                                <div className="flex items-center justify-between sm:justify-end gap-3">
                                  <span className="font-extrabold text-slate-900 text-sm">Rp 75.000 / Bulan</span>
                                  <div className="flex gap-1">
                                    <button onClick={() => showToast('Edit Jenis Iuran')} className="px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold rounded-lg text-[11px]">
                                      Edit
                                    </button>
                                    <button onClick={() => showToast('Iuran dinonaktifkan')} className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-lg text-[11px]">
                                      Nonaktifkan
                                    </button>
                                  </div>
                                </div>
                              </div>

                              {/* Item 2 */}
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs gap-3">
                                <div>
                                  <p className="font-bold text-slate-800 text-sm">Kas Rutin RT 05</p>
                                  <p className="text-[11px] text-slate-500">Tipe: Rutin Bulanan | Sasaran: Seluruh Warga RT</p>
                                </div>
                                <div className="flex items-center justify-between sm:justify-end gap-3">
                                  <span className="font-extrabold text-slate-900 text-sm">Rp 50.000 / Bulan</span>
                                  <div className="flex gap-1">
                                    <button onClick={() => showToast('Edit Jenis Iuran')} className="px-2.5 py-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold rounded-lg text-[11px]">
                                      Edit
                                    </button>
                                    <button onClick={() => showToast('Iuran dinonaktifkan')} className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-lg text-[11px]">
                                      Nonaktifkan
                                    </button>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>

                        </div>
                      )}

                      {/* PAGE 2: DASHBOARD */}
                      {adminPage === 'dashboard' && (
                        <div className="space-y-4">
                          <h1 className="text-xl font-bold text-slate-800">Dashboard Utama Keuangan</h1>
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                              <p className="text-slate-500">Total Saldo Kas RT</p>
                              <p className="text-xl font-black text-slate-800">Rp 24.850.000</p>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                              <p className="text-slate-500">Pemasukan (Bulan Ini)</p>
                              <p className="text-xl font-black text-emerald-600">Rp 3.200.000</p>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* PAGE 3: PAYMENTS */}
                      {adminPage === 'payments' && (
                        <div className="space-y-4">
                          <h1 className="text-xl font-bold text-slate-800">Verifikasi Pembayaran Transfer Warga</h1>
                          <div className="bg-white p-4 rounded-xl border text-xs">
                            <p className="font-bold text-slate-800">Budi Santoso (Blok A1/02) — Rp 75.000</p>
                            <button onClick={() => showToast('Pembayaran Disetujui')} className="mt-2 bg-emerald-600 text-white font-bold px-3 py-1 rounded-lg">Setujui</button>
                          </div>
                        </div>
                      )}

                    </div>
                  </main>

                </div>

              </div>
            )}

            {/* ------------------------------------------------------------- */}
            {/* 2. PWA SMARTPHONE FRAME VIEW (OPSIONAL VIA TOGGLE)            */}
            {/* ------------------------------------------------------------- */}
            {viewMode === 'pwa' && (
              <div className="w-[350px] mx-auto bg-slate-900 rounded-[42px] p-3 shadow-2xl border-4 border-slate-800 flex flex-col justify-between flex-shrink-0 relative">
                
                {/* Smartphone Notch */}
                <div className="absolute top-5 left-1/2 -translate-x-1/2 w-28 h-4 bg-slate-950 rounded-full z-30 flex items-center justify-end px-2">
                  <div className="w-2.5 h-2.5 rounded-full bg-indigo-950 border border-indigo-500/30"></div>
                </div>

                {/* Smartphone Inner Screen */}
                <div className="w-full h-[630px] bg-slate-100 rounded-[32px] overflow-hidden flex flex-col pt-6 text-slate-800 relative font-sans shadow-inner">
                  
                  {/* App Bar PWA */}
                  <div className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-md">
                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded-md bg-emerald-500 text-slate-950 font-black text-[10px] flex items-center justify-center">KW</div>
                      <div>
                        <h3 className="text-xs font-bold leading-tight">Kas Warga PWA</h3>
                        <p className="text-[9px] text-emerald-400 font-semibold">RT 05 / RW 02</p>
                      </div>
                    </div>
                    <div className="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-xs">BS</div>
                  </div>

                  {/* DYNAMIC CONTENT PWA WARGA */}
                  <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5">
                    
                    {pwaPage === 'tagihan' && (
                      <div className="space-y-3.5 text-xs">
                        
                        <div className="flex justify-between items-center">
                          <h3 className="font-bold text-slate-800 text-sm">Tagihan & Iuran Saya</h3>
                          <button onClick={() => showToast('Form Pengajuan Keringanan')} className="text-[10px] bg-white border border-slate-300 text-slate-700 font-bold px-2 py-1 rounded-lg">
                            + Keringanan
                          </button>
                        </div>

                        {/* Active Invoice Card */}
                        <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl space-y-2 shadow-sm">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-extrabold text-amber-950">Iuran Kebersihan & Security</span>
                            <span className="text-[9px] bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded-full">Belum Lunas</span>
                          </div>
                          <div className="flex justify-between items-baseline">
                            <p className="text-sm font-black text-slate-900">Rp 75.000</p>
                            <span className="text-[10px] text-slate-500">Tempo: 31 Oct</span>
                          </div>
                          <button 
                            onClick={() => showToast('Form Upload Resi Pembayaran')}
                            className="w-full bg-emerald-600 text-white font-bold text-xs py-2 rounded-xl flex items-center justify-center gap-1.5 shadow-sm">
                            <i data-lucide="upload" className="w-4 h-4"></i> Upload Resi Pembayaran
                          </button>
                        </div>

                        {/* List Tarif Resmi */}
                        <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                          <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Tarif Resmi Iuran RT 05</span>
                          <div className="space-y-1.5 pt-1">
                            <div className="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100">
                              <div>
                                <p className="font-bold text-slate-800 text-[11px]">Iuran Kebersihan & Security</p>
                                <p className="text-[9px] text-slate-400">Rutin Bulanan</p>
                              </div>
                              <span className="font-extrabold text-slate-900 text-xs">Rp 75.000</span>
                            </div>

                            <div className="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100">
                              <div>
                                <p className="font-bold text-slate-800 text-[11px]">Kas Rutin RT 05</p>
                                <p className="text-[9px] text-slate-400">Rutin Bulanan</p>
                              </div>
                              <span className="font-extrabold text-slate-900 text-xs">Rp 50.000</span>
                            </div>
                          </div>
                        </div>

                      </div>
                    )}

                    {pwaPage === 'beranda' && (
                      <div className="bg-emerald-600 text-white p-3.5 rounded-xl font-bold text-xs">
                        Beranda Warga. Klik menu "Tagihan" di bawah.
                      </div>
                    )}

                  </div>

                  {/* Bottom Navigation PWA */}
                  <div className="h-14 bg-white border-t border-slate-200 flex items-center justify-around text-slate-400 text-[10px] font-medium">
                    <button onClick={() => setPwaPage('beranda')} className={`flex flex-col items-center gap-0.5 ${pwaPage === 'beranda' ? 'text-emerald-600 font-bold' : 'hover:text-slate-800'}`}>
                      <i data-lucide="home" className="w-4 h-4"></i> Beranda
                    </button>
                    <button onClick={() => setPwaPage('tagihan')} className={`flex flex-col items-center gap-0.5 ${pwaPage === 'tagihan' ? 'text-emerald-600 font-bold' : 'hover:text-slate-800'}`}>
                      <i data-lucide="file-text" className="w-4 h-4"></i> Tagihan
                    </button>
                    <button onClick={() => showToast('Profil Warga')} className="flex flex-col items-center gap-0.5 hover:text-slate-800">
                      <i data-lucide="user" className="w-4 h-4"></i> Profil
                    </button>
                  </div>

                </div>

              </div>
            )}

          </div>

          {/* Modal Pop-up Responsif: Tambah Jenis Iuran Baru */}
          {showAddIuranModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-sm">Buat / Tambah Jenis Iuran Baru</h3>
                  <button onClick={() => setShowAddIuranModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                
                <div className="p-5 space-y-3.5 text-xs">
                  <div className="space-y-1">
                    <label className="font-bold text-slate-700">Nama Jenis Iuran</label>
                    <input type="text" placeholder="Contoh: Sumbangan Duka Cita / PHBN" className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500" />
                  </div>

                  <div className="space-y-1">
                    <label className="font-bold text-slate-700">Sifat Iuran</label>
                    <select className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500">
                      <option>Rutin Bulanan</option>
                      <option>Insidental / Khusus</option>
                    </select>
                  </div>

                  <div className="space-y-1">
                    <label className="font-bold text-slate-700">Nominal Default (Rp)</label>
                    <input type="number" placeholder="50000" className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500" />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      onClick={() => {
                        setShowAddIuranModal(false);
                        showToast('Jenis Iuran Baru Berhasil Ditambahkan!');
                      }} 
                      className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl">
                      Simpan Jenis Iuran
                    </button>
                    <button 
                      onClick={() => setShowAddIuranModal(false)} 
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-xl">
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
