<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Warga — RT 17 / RW 45</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Configuration (Kas Warga Theme Colors) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              800: '#1e3a8a',
              900: '#0f2355', // Deep Royal Blue khas Logo Kas Warga
              blue: '#163988', // Navy Accent
            },
            gold: {
              300: '#fde047',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-400 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DATA AWAL NYATA INTERAKTIF (RT 17 / RW 45) ---
    const INITIAL_HOUSES = [
      { id: 'H01', block: 'A1/02', owner: 'Budi Santoso', phone: '081234567890', status: 'Tetap', residents: 4, isOccupied: true },
      { id: 'H02', block: 'A1/03', owner: 'Siti Rahma', phone: '081298765432', status: 'Kontrak', residents: 3, isOccupied: true },
      { id: 'H03', block: 'A2/01', owner: 'Ahmad Dahlan', phone: '081311223344', status: 'Tetap', residents: 5, isOccupied: true },
      { id: 'H04', block: 'B1/05', owner: 'Bambang Wijaya', phone: '081555667788', status: 'Tetap', residents: 2, isOccupied: true },
      { id: 'H05', block: 'B2/08', owner: 'Rumah Kosong (Bpk. Roy)', phone: '081700998877', status: 'Kosong', residents: 0, isOccupied: false },
    ];

    const INITIAL_BILLINGS = [
      { id: 'BILL-01', name: 'Iuran Keamanan & Kebersihan', amount: 75000, type: 'Rutin Bulanan', target: 'Semua Warga', period: 'Oktober 2026', status: 'Aktif' },
      { id: 'BILL-02', name: 'Kas Rutin RT 17', amount: 25000, type: 'Rutin Bulanan', target: 'Semua Warga', period: 'Oktober 2026', status: 'Aktif' },
      { id: 'BILL-03', name: 'Sumbangan Perbaikan Lampu Jalan', amount: 20000, type: 'Insidental', target: 'Warga Tetap', period: 'Oktober 2026', status: 'Aktif' },
    ];

    const INITIAL_PAYMENTS = [
      { id: 'PAY-101', date: '2026-10-21', house: 'A1/02 (Budi Santoso)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Transfer QRIS RT 17', status: 'Menunggu Verifikasi', proof: 'https://placehold.co/300x400/0f2355/ffffff?text=Resi+QRIS+Budi+Santoso' },
      { id: 'PAY-102', date: '2026-10-20', house: 'A1/03 (Siti Rahma)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Transfer Bank Mandiri', status: 'Menunggu Verifikasi', proof: 'https://placehold.co/300x400/0f2355/ffffff?text=Resi+M-Banking+Siti' },
      { id: 'PAY-100', date: '2026-10-18', house: 'A2/01 (Ahmad Dahlan)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Tunai (Bendahara)', status: 'Terverifikasi', proof: null },
    ];

    const INITIAL_CASHBOOK = [
      { id: 'TRX-001', date: '2026-10-01', type: 'Pemasukan', category: 'Iuran Warga', description: 'Pembayaran Iuran A2/01 Ahmad Dahlan', amount: 100000 },
      { id: 'TRX-002', date: '2026-10-05', type: 'Pengeluaran', category: 'Keamanan', description: 'Honor Operasional Satpam RT 17 (2 Orang)', amount: 1800000 },
      { id: 'TRX-003', date: '2026-10-10', type: 'Pengeluaran', category: 'Kebersihan', description: 'Retribusi Pengangkutan Sampah DLH', amount: 600000 },
      { id: 'TRX-004', date: '2026-10-15', type: 'Pemasukan', category: 'Sewa Fasilitas', description: 'Sewa Lapangan Bulutangkis Warga', amount: 350000 },
    ];

    const INITIAL_ANNOUNCEMENTS = [
      { id: 'ANN-01', title: 'Kerja Bakti Minggu Pagi Lingkungan RT 17', date: '2026-10-20', author: 'Pak Sarjito (Ketua RT 17)', category: 'Kegiatan', content: 'Diimbau kepada seluruh warga RT 17 / RW 45 untuk menghadiri kerja bakti pembersihan selokan pada hari Minggu pukul 07:00 WIB di lapangan utama.' },
      { id: 'ANN-02', title: 'Transparansi LPJ Keuangan Kas Triwulan III', date: '2026-10-15', author: 'Budi Santoso (Bendahara RT)', category: 'LPJ Keuangan', content: 'Laporan Pertanggungjawaban (LPJ) keuangan periode Juli - September 2026 telah terverifikasi balans dan dapat diunduh oleh seluruh warga.' },
    ];

    const INITIAL_REGISTRATIONS = [
      { id: 'REG-01', name: 'Dr. Hendra Gunawan', block: 'B1/02', type: 'Warga Baru (Pindahan)', phone: '082199887766', date: '2026-10-21', status: 'Pending' },
      { id: 'REG-02', name: 'Dewi Lestari', block: 'A2/05', type: 'Warga Baru (Kontrak)', phone: '085711223344', date: '2026-10-19', status: 'Pending' },
    ];

    // --- KOMPONEN LOGO KAS WARGA (SAMA DENGAN ICON-192.PNG) ---
    function KasWargaLogo({ className = "w-10 h-10", textSize = "text-[9px]" }) {
      return (
        <div className={`relative bg-gradient-to-br from-blue-900 via-brand-blue to-slate-900 rounded-2xl p-1.5 shadow-xl border border-blue-400/30 flex flex-col items-center justify-center text-center overflow-hidden flex-shrink-0 ${className}`}>
          {/* Siluet Atap Rumah */}
          <div className="flex items-end justify-center gap-0.5 opacity-90 mb-0.5">
            <div className="w-2.5 h-2.5 bg-white rounded-t-sm relative">
              <div className="absolute -top-1 -left-0.5 w-3.5 h-1.5 bg-amber-500" style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}></div>
            </div>
            <div className="w-3.5 h-3.5 bg-white rounded-t-sm relative z-10">
              <div className="absolute -top-1.5 -left-0.5 w-4.5 h-2 bg-orange-600" style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}></div>
            </div>
            <div className="w-2.5 h-2.5 bg-white rounded-t-sm relative">
              <div className="absolute -top-1 -left-0.5 w-3.5 h-1.5 bg-amber-500" style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}></div>
            </div>
          </div>
          
          {/* Koin Emas Rp Badge */}
          <div className="bg-gradient-to-tr from-amber-600 via-gold-400 to-yellow-200 text-slate-950 font-black text-[8px] px-1.5 py-0.2 rounded-full shadow-md border border-amber-300 flex items-center justify-center gap-0.5 -mt-1.5 z-20">
            <span>Rp</span>
          </div>

          <span className={`font-black text-white tracking-wider leading-none mt-0.5 uppercase ${textSize}`}>
            KAS WARGA
          </span>
        </div>
      );
    }

    function App() {
      // Role State: 'landing' | 'admin' | 'warga'
      const [roleMode, setRoleMode] = useState('landing');
      
      // Admin Selected Page / Sub-Module
      const [adminTab, setAdminTab] = useState('dashboard'); // 'dashboard' | 'warga' | 'verifikasi' | 'bukukas' | 'module'
      const [activeAdminModule, setActiveAdminModule] = useState('dashboard');
      const [showModuleDrawer, setShowModuleDrawer] = useState(false);

      // Warga Selected Tab (5 Tabs)
      const [wargaTab, setWargaTab] = useState('beranda');

      // Shared Datasets State
      const [houses, setHouses] = useState(INITIAL_HOUSES);
      const [billings, setBillings] = useState(INITIAL_BILLINGS);
      const [payments, setPayments] = useState(INITIAL_PAYMENTS);
      const [cashbook, setCashbook] = useState(INITIAL_CASHBOOK);
      const [announcements, setAnnouncements] = useState(INITIAL_ANNOUNCEMENTS);
      const [registrations, setRegistrations] = useState(INITIAL_REGISTRATIONS);

      // Modals & Feedback State
      const [modalType, setModalType] = useState(null);
      const [selectedProof, setSelectedProof] = useState(null);
      const [toast, setToast] = useState(null);

      // Form State
      const [newHouse, setNewHouse] = useState({ block: '', owner: '', phone: '', status: 'Tetap', residents: 3 });
      const [newBilling, setNewBilling] = useState({ name: '', amount: '', type: 'Rutin Bulanan', target: 'Semua Warga' });
      const [newTrx, setNewTrx] = useState({ type: 'Pemasukan', category: 'Iuran Warga', description: '', amount: '' });
      const [newAnnouncement, setNewAnnouncement] = useState({ title: '', category: 'Kegiatan', content: '' });

      // Form Upload Resi Transfer Warga
      const [wargaUploadForm, setWargaUploadForm] = useState({
        billingName: 'Iuran Keamanan & Kebersihan (Rp 75.000)',
        method: 'QRIS RT 17 / RW 45',
        proofPreset: 'https://placehold.co/300x400/0f2355/ffffff?text=Resi+QRIS+Budi+Santoso'
      });

      useEffect(() => {
        try {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        } catch (e) {
          console.log("Lucide icons rendering safely");
        }
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Real-Time Calculations
      const totalIncome = useMemo(() => cashbook.filter(t => t.type === 'Pemasukan').reduce((acc, curr) => acc + Number(curr.amount), 0), [cashbook]);
      const totalExpense = useMemo(() => cashbook.filter(t => t.type === 'Pengeluaran').reduce((acc, curr) => acc + Number(curr.amount), 0), [cashbook]);
      const currentBalance = 24850000 + totalIncome - totalExpense;

      // Pending Payment Verification Count (Badge)
      const pendingCount = useMemo(() => payments.filter(p => p.status === 'Menunggu Verifikasi').length, [payments]);

      // Budi Santoso Payment Status in PWA Warga
      const budiPaymentStatus = useMemo(() => {
        const p = payments.find(pay => pay.house.includes('A1/02') || pay.house.includes('Budi Santoso'));
        return p ? p.status : 'Belum Lunas';
      }, [payments]);

      // --- ACTION HANDLERS ---
      
      // 1. Warga Action: Submit Resi Transfer (Directly synced to Admin Module 4)
      const handleWargaSubmitProof = (e) => {
        e.preventDefault();
        const newPayment = {
          id: `PAY-${Date.now()}`,
          date: new Date().toISOString().split('T')[0],
          house: 'A1/02 (Budi Santoso)',
          billing: wargaUploadForm.billingName,
          total: wargaUploadForm.billingName.includes('20.000') ? 20000 : 100000,
          method: wargaUploadForm.method,
          status: 'Menunggu Verifikasi',
          proof: wargaUploadForm.proofPreset
        };

        setPayments([newPayment, ...payments]);
        setModalType(null);
        showToast('🚀 Resi transfer dikirim! Antrean Verifikasi Pak Sarjito bertambah.');
      };

      // 2. Admin Action: Verifikasi Resi (Approve / Reject)
      const handleVerifyPayment = (id, isApprove) => {
        const targetPayment = payments.find(p => p.id === id);
        setPayments(payments.map(p => p.id === id ? { ...p, status: isApprove ? 'Terverifikasi' : 'Ditolak' } : p));
        
        if (isApprove && targetPayment) {
          const autoCashTrx = {
            id: `TRX-${Date.now()}`,
            date: new Date().toISOString().split('T')[0],
            type: 'Pemasukan',
            category: 'Iuran Warga',
            description: `Iuran Masuk: ${targetPayment.billing} - ${targetPayment.house}`,
            amount: targetPayment.total
          };
          setCashbook(prev => [autoCashTrx, ...prev]);
        }
        showToast(isApprove ? '✅ Pembayaran DISETUJUI! Kas RT 17 bertambah & PWA Warga otomatis LUNAS.' : '❌ Pembayaran Ditolak.');
      };

      const handleAddHouse = (e) => {
        e.preventDefault();
        const created = { ...newHouse, id: `H${Date.now()}`, isOccupied: newHouse.status !== 'Kosong', residents: Number(newHouse.residents) };
        setHouses([...houses, created]);
        setModalType(null);
        setNewHouse({ block: '', owner: '', phone: '', status: 'Tetap', residents: 3 });
        showToast('Data warga & rumah berhasil ditambahkan!');
      };

      const handleAddBilling = (e) => {
        e.preventDefault();
        const created = { ...newBilling, id: `BILL-${Date.now()}`, amount: Number(newBilling.amount), period: 'Oktober 2026', status: 'Aktif' };
        setBillings([...billings, created]);
        setModalType(null);
        setNewBilling({ name: '', amount: '', type: 'Rutin Bulanan', target: 'Semua Warga' });
        showToast('Jenis iuran baru dipublikasikan!');
      };

      const handleAddTrx = (e) => {
        e.preventDefault();
        const created = { ...newTrx, id: `TRX-${Date.now()}`, date: new Date().toISOString().split('T')[0], amount: Number(newTrx.amount) };
        setCashbook([created, ...cashbook]);
        setModalType(null);
        setNewTrx({ type: 'Pemasukan', category: 'Iuran Warga', description: '', amount: '' });
        showToast('Mutasi kas baru berhasil dicatat!');
      };

      const handleAddAnnouncement = (e) => {
        e.preventDefault();
        const created = { ...newAnnouncement, id: `ANN-${Date.now()}`, date: new Date().toISOString().split('T')[0], author: 'Pak Sarjito (Ketua RT 17)' };
        setAnnouncements([created, ...announcements]);
        setModalType(null);
        setNewAnnouncement({ title: '', category: 'Kegiatan', content: '' });
        showToast('Pengumuman resmi diterbitkan ke PWA Warga!');
      };

      const handleApproveRegistration = (id) => {
        const reg = registrations.find(r => r.id === id);
        if (reg) {
          const newH = {
            id: `H${Date.now()}`,
            block: reg.block,
            owner: reg.name,
            phone: reg.phone,
            status: reg.type.includes('Kontrak') ? 'Kontrak' : 'Tetap',
            residents: 3,
            isOccupied: true
          };
          setHouses(prev => [...prev, newH]);
        }
        setRegistrations(registrations.filter(r => r.id !== id));
        showToast('Pendaftaran warga disetujui & dimasukkan ke database!');
      };

      const all15Modules = [
        { id: 'dashboard', name: '1. Dashboard Utama', category: 'Utama', icon: 'layout-dashboard' },
        { id: 'residents', name: '2. Data Warga & Rumah', category: 'Keanggotaan', icon: 'users' },
        { id: 'billing', name: '3. Tagihan & Jenis Iuran', category: 'Keuangan', icon: 'receipt' },
        { id: 'payments', name: '4. Verifikasi Bayar', category: 'Keuangan', icon: 'check-square', badge: pendingCount },
        { id: 'finance', name: '5. Buku Kas & Transaksi', category: 'Keuangan', icon: 'book-open' },
        { id: 'expenses', name: '6. Pos Pengeluaran', category: 'Keuangan', icon: 'pie-chart' },
        { id: 'reconciliation', name: '7. Rekonsiliasi Saldo Bank', category: 'Keuangan', icon: 'scale' },
        { id: 'reports', name: '8. Laporan & Tutup Buku', category: 'Keuangan', icon: 'file-spreadsheet' },
        { id: 'announcements', name: '9. Pengumuman & LPJ', category: 'Publikasi', icon: 'megaphone' },
        { id: 'whatsapp', name: '10. Integrasi WhatsApp', category: 'Publikasi', icon: 'message-square' },
        { id: 'registrations', name: '11. Pendaftaran Baru', category: 'Sistem', icon: 'user-plus', badge: registrations.length },
        { id: 'registration-links', name: '12. Link Form QRIS/Mandiri', category: 'Sistem', icon: 'link' },
        { id: 'users', name: '13. Pengguna & Akses', category: 'Sistem', icon: 'shield-check' },
        { id: 'audit', name: '14. Audit Log Aktivitas', category: 'Sistem', icon: 'history' },
        { id: 'license', name: '15. Lisensi SaaS Aplikasi', category: 'Sistem', icon: 'badge-check' },
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 font-sans">
          
          {/* FLOATING TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-4 right-4 z-50 bg-amber-400 text-slate-950 font-black px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 text-xs animate-bounce border-2 border-yellow-200">
              <i data-lucide="check-circle-2" className="w-5 h-5 flex-shrink-0"></i>
              <span>{toast}</span>
            </div>
          )}

          {/* TOP DEMO HEADER BAR */}
          <header className="h-14 bg-brand-900 border-b border-blue-900 flex items-center justify-between px-3 sm:px-6 z-40 flex-shrink-0">
            <div className="flex items-center gap-2">
              <div className="bg-amber-400 text-slate-950 font-black rounded-lg px-2 py-0.5 text-xs tracking-wider flex items-center gap-1 shadow">
                <i data-lucide="wallet" className="w-4 h-4"></i> KAS WARGA
              </div>
              <span className="text-xs font-semibold text-slate-200 hidden sm:inline border-l border-blue-800 pl-2">
                RT 17 / RW 45
              </span>
            </div>

            {/* Role Switcher */}
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-blue-900 text-[11px]">
              <button 
                onClick={() => { setRoleMode('landing'); showToast('Buka Layar Pilihan Demo'); }} 
                className={`px-2.5 py-1 rounded-lg font-medium transition ${roleMode === 'landing' ? 'bg-amber-400 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'}`}>
                Landing
              </button>
              <button 
                onClick={() => { setRoleMode('admin'); showToast('Masuk Portal Admin Pak Sarjito'); }} 
                className={`px-2.5 py-1 rounded-lg font-medium transition ${roleMode === 'admin' ? 'bg-amber-400 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'}`}>
                Admin PWA
              </button>
              <button 
                onClick={() => { setRoleMode('warga'); showToast('Masuk Portal Warga Budi Santoso'); }} 
                className={`px-2.5 py-1 rounded-lg font-medium transition ${roleMode === 'warga' ? 'bg-amber-400 text-slate-950 font-bold shadow' : 'text-slate-400 hover:text-white'}`}>
                Warga PWA
              </button>
            </div>
          </header>

          {/* =================================================================== */}
          {/* 1. LANDING PAGE ROLE SELECTOR                                       */}
          {/* =================================================================== */}
          {roleMode === 'landing' && (
            <div className="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 bg-gradient-to-b from-brand-900 via-slate-950 to-slate-950">
              
              <div className="text-center space-y-3 max-w-md mb-8">
                <div className="w-24 h-24 mx-auto mb-2">
                  <KasWargaLogo className="w-full h-full" textSize="text-xs" />
                </div>
                <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight">KAS WARGA</h1>
                <p className="text-xs sm:text-sm text-slate-300">
                  Sistem Informasi Keuangan RT/RW Transparan<br/>
                  <strong className="text-amber-400">Wilayah RT 17 / RW 45</strong>
                </p>
              </div>

              {/* 2 Main Demo Cards */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full max-w-2xl">
                
                {/* Option 1: Admin PWA */}
                <div 
                  onClick={() => { setRoleMode('admin'); showToast('Masuk PWA Admin Pak Sarjito (Ketua RT 17)'); }}
                  className="bg-brand-blue/80 hover:bg-brand-blue border-2 border-blue-500/50 hover:border-amber-400 p-6 rounded-3xl cursor-pointer transition-all transform hover:-translate-y-1 shadow-2xl flex flex-col justify-between group">
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <div className="w-12 h-12 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center font-black">
                        <i data-lucide="shield-check" className="w-6 h-6"></i>
                      </div>
                      <span className="text-[10px] font-bold bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2.5 py-1 rounded-full">
                        Admin PWA (15 Modul)
                      </span>
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white group-hover:text-amber-300 transition">
                        Demo Pengurus RT (Pak Sarjito)
                      </h2>
                      <p className="text-xs text-slate-300 mt-1">
                        Portal Admin PWA dalam <strong>Bingkai Smartphone Identik</strong>. Mengelola 15 modul interaktif verifikasi resi, kas RT, dan data warga.
                      </p>
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t border-blue-800 flex items-center justify-between text-xs font-bold text-amber-400">
                    <span>Buka PWA Admin</span>
                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                  </div>
                </div>

                {/* Option 2: Warga PWA */}
                <div 
                  onClick={() => { setRoleMode('warga'); showToast('Masuk PWA Warga (Budi Santoso - Blok A1/02)'); }}
                  className="bg-slate-900/80 hover:bg-slate-900 border-2 border-slate-700 hover:border-emerald-500 p-6 rounded-3xl cursor-pointer transition-all transform hover:-translate-y-1 shadow-2xl flex flex-col justify-between group">
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <div className="w-12 h-12 rounded-2xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black">
                        <i data-lucide="smartphone" className="w-6 h-6"></i>
                      </div>
                      <span className="text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                        PWA Warga Mobile
                      </span>
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white group-hover:text-emerald-400 transition">
                        Demo Warga (Budi Santoso - A1/02)
                      </h2>
                      <p className="text-xs text-slate-300 mt-1">
                        Portal PWA Mobile Warga dalam <strong>Bingkai Smartphone Identik</strong>. Bayar iuran, upload resi, dan cek transparansi saldo kas RT 17.
                      </p>
                    </div>
                  </div>

                      <div className="space-y-3">
                        <div className="flex justify-between items-center border-b pb-2">
                          <h3 className="font-bold text-slate-800 text-xs">Buku Kas Mutasi Utama</h3>
                          <button onClick={() => setModalType('addTransaction')} className="bg-brand-blue text-white font-bold text-[10px] px-2.5 py-1.5 rounded-xl shadow">
                            + Mutasi
                          </button>
                        </div>

                        <div className="space-y-2">
                          {cashbook.map(t => (
                            <div key={t.id} className="bg-white p-2.5 rounded-2xl border border-slate-200 text-xs flex justify-between items-center shadow-sm">
                              <div>
                                <p className="font-bold text-slate-800">{t.description}</p>
                                <p className="text-[9px] text-slate-400">{t.date} • {t.category}</p>
                              </div>
                              <span className={`font-black text-xs ${t.type === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                {t.type === 'Pemasukan' ? '+' : '-'} Rp {t.amount.toLocaleString('id-ID')}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* DRAWER / MODULE ACCESSED SCREEN */}
                    {adminTab === 'module' && (
                      <div className="space-y-3">
                        <div className="flex items-center gap-2 border-b pb-2">
                          <button onClick={() => setAdminTab('dashboard')} className="p-1 bg-slate-200 rounded-lg text-slate-700">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i>
                          </button>
                          <h3 className="font-bold text-slate-800 text-xs capitalize">
                            Modul: {activeAdminModule}
                          </h3>
                        </div>

                        {/* Modul 3: Billing */}
                        {activeAdminModule === 'billing' && (
                          <div className="space-y-3">
                            <div className="flex justify-between items-center">
                              <h4 className="font-bold text-slate-800 text-xs">Tarif Jenis Iuran Terdaftar</h4>
                              <button onClick={() => setModalType('addBilling')} className="bg-brand-blue text-white font-bold text-[10px] px-2 py-1 rounded-lg">+ Jenis Iuran</button>
                            </div>
                            {billings.map(b => (
                              <div key={b.id} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                                <span className="text-[9px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{b.type}</span>
                                <h4 className="font-bold text-slate-800 text-xs">{b.name}</h4>
                                <p className="font-black text-slate-900 text-sm">Rp {b.amount.toLocaleString('id-ID')} / Rumah</p>
                              </div>
                            ))}
                          </div>
                        )}

                        {/* Modul 6: Expenses */}
                        {activeAdminModule === 'expenses' && (
                          <div className="space-y-2.5">
                            <h4 className="font-bold text-slate-800 text-xs">Pos Anggaran Operasional RT 17</h4>
                            <div className="bg-white p-3 rounded-2xl border border-slate-200 space-y-1">
                              <p className="font-bold text-slate-800 text-xs">Honor Satpam RT 17</p>
                              <p className="text-[10px] text-slate-500">Anggaran: Rp 1.800.000 / bln</p>
                              <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div className="bg-emerald-500 h-full w-full"></div>
                              </div>
                            </div>
                          </div>
                        )}

                        {/* Modul 7: Reconciliation */}
                        {activeAdminModule === 'reconciliation' && (
                          <div className="bg-white p-3 rounded-2xl border border-slate-200 space-y-2 text-xs">
                            <p className="font-bold text-slate-800">Rekonsiliasi Bank vs Fisik Kas</p>
                            <p className="text-slate-600">Saldo Catatan Kas: <strong>Rp {currentBalance.toLocaleString('id-ID')}</strong></p>
                            <p className="text-slate-600">Saldo Bank Mandiri: <strong>Rp {currentBalance.toLocaleString('id-ID')}</strong></p>
                            <div className="bg-emerald-100 text-emerald-800 font-bold p-2 rounded-xl text-center text-[10px]">
                              ✓ Status: BALANS & SINKRON
                            </div>
                          </div>
                        )}

                        {/* Modul 8: Reports */}
                        {activeAdminModule === 'reports' && (
                          <div className="space-y-2 text-xs">
                            <button onClick={() => showToast('Mendownload Laporan Kas PDF...')} className="w-full bg-brand-blue text-white font-bold p-3 rounded-2xl shadow">
                              📄 Download Laporan Kas (PDF)
                            </button>
                            <button onClick={() => showToast('Mendownload Rekap Excel...')} className="w-full bg-emerald-600 text-white font-bold p-3 rounded-2xl shadow">
                              📊 Download Rekap Tunggakan (Excel)
                            </button>
                          </div>
                        )}

                        {/* Modul 9: Announcements */}
                        {activeAdminModule === 'announcements' && (
                          <div className="space-y-2">
                            <button onClick={() => setModalType('addAnnouncement')} className="w-full bg-brand-blue text-white font-bold p-2.5 rounded-2xl text-xs">+ Buat Pengumuman</button>
                            {announcements.map(a => (
                              <div key={a.id} className="bg-white p-3 rounded-2xl border border-slate-200 space-y-1 text-xs">
                                <h4 className="font-bold text-slate-800">{a.title}</h4>
                                <p className="text-slate-600 text-[10px]">{a.content}</p>
                              </div>
                            ))}
                          </div>
                        )}

                        {/* Modul 10: WhatsApp */}
                        {activeAdminModule === 'whatsapp' && (
                          <div className="bg-white p-3 rounded-2xl border border-slate-200 space-y-2 text-xs">
                            <p className="font-bold text-slate-800">Teks Penagihan WhatsApp:</p>
                            <textarea className="w-full bg-slate-50 border p-2 rounded-xl text-[10px]" rows="3" readOnly value="Yth. Warga RT 17. Tagihan iuran Oktober 2026 telah diterbitkan. Mohon upload bukti transfer di PWA Warga. Terima kasih - Pak Sarjito"></textarea>
                            <button onClick={() => showToast('Teks WA Berhasil Disalin!')} className="w-full bg-emerald-600 text-white font-bold p-2 rounded-xl">Salin Teks WA</button>
                          </div>
                        )}

                        {/* Fallback for other modules */}
                        {!['billing', 'expenses', 'reconciliation', 'reports', 'announcements', 'whatsapp'].includes(activeAdminModule) && (
                          <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
                            <span className="bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded text-[10px]">Modul Active</span>
                            <h4 className="font-bold text-slate-800 text-sm capitalize">{activeAdminModule}</h4>
                            <p className="text-slate-500">Modul terintegrasi penuh untuk pengurus RT 17 / RW 45.</p>
                          </div>
                        )}

                      </div>
                    )}

                  </div>

                  {/* BOTTOM NAVIGATION BAR ADMIN (5 TOMBOL IDENTIK) */}
                  <div className="h-16 bg-brand-900 border-t border-blue-900 text-white flex items-center justify-around text-[9px] font-bold rounded-b-[30px] flex-shrink-0">
                    <button onClick={() => setAdminTab('dashboard')} className={`flex flex-col items-center gap-0.5 ${adminTab === 'dashboard' ? 'text-amber-400 font-extrabold' : 'text-slate-300'}`}>
                      <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Dashboard
                    </button>
                    <button onClick={() => setAdminTab('warga')} className={`flex flex-col items-center gap-0.5 ${adminTab === 'warga' ? 'text-amber-400 font-extrabold' : 'text-slate-300'}`}>
                      <i data-lucide="users" className="w-4 h-4"></i> Warga
                    </button>
                    <button onClick={() => setAdminTab('verifikasi')} className={`flex flex-col items-center gap-0.5 relative ${adminTab === 'verifikasi' ? 'text-amber-400 font-extrabold' : 'text-slate-300'}`}>
                      <i data-lucide="check-square" className="w-4 h-4"></i> Verifikasi
                      {pendingCount > 0 && (
                        <span className="absolute -top-1 -right-1 bg-amber-400 text-slate-950 font-black text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center animate-bounce">
                          {pendingCount}
                        </span>
                      )}
                    </button>
                    <button onClick={() => setAdminTab('bukukas')} className={`flex flex-col items-center gap-0.5 ${adminTab === 'bukukas' ? 'text-amber-400 font-extrabold' : 'text-slate-300'}`}>
                      <i data-lucide="book-open" className="w-4 h-4"></i> Buku Kas
                    </button>
                    <button onClick={() => setShowModuleDrawer(true)} className="flex flex-col items-center gap-0.5 text-amber-300 hover:text-white">
                      <i data-lucide="grid" className="w-4 h-4"></i> Menu (15)
                    </button>
                  </div>

                </div>

              </div>

            </div>
          )}

          {/* =================================================================== */}
          {/* BOTTOM DRAWER SHEET FOR ALL 15 ADMIN MODULES                       */}
          {/* =================================================================== */}
          {showModuleDrawer && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col justify-end p-0 sm:items-center sm:justify-center sm:p-4">
              <div className="bg-slate-900 text-white rounded-t-3xl sm:rounded-3xl max-w-sm w-full max-h-[80vh] overflow-y-auto border border-blue-900 shadow-2xl p-4 space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <div className="flex items-center gap-2">
                    <KasWargaLogo className="w-6 h-6" textSize="text-[5px]" />
                    <h3 className="font-extrabold text-xs text-white">Seluruh 15 Modul Admin RT 17</h3>
                  </div>
                  <button onClick={() => setShowModuleDrawer(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2 text-xs">
                  {all15Modules.map(mod => (
                    <button 
                      key={mod.id}
                      onClick={() => {
                        setActiveAdminModule(mod.id);
                        setAdminTab('module');
                        setShowModuleDrawer(false);
                      }}
                      className="p-2.5 rounded-2xl bg-slate-800/90 border border-slate-700 hover:bg-brand-blue text-left flex flex-col justify-between space-y-1.5 transition">
                      <div className="flex justify-between items-center">
                        <i data-lucide={mod.icon} className="w-4 h-4 text-amber-400"></i>
                        {mod.badge > 0 && (
                          <span className="bg-amber-400 text-slate-950 font-black text-[8px] px-1.5 py-0.2 rounded-full">
                            {mod.badge}
                          </span>
                        )}
                      </div>
                      <span className="font-bold text-[10px] text-white leading-tight">{mod.name}</span>
                    </button>
                  ))}
                </div>

                <button onClick={() => setShowModuleDrawer(false)} className="w-full bg-slate-800 text-slate-300 font-bold py-2 rounded-xl text-xs">
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* =================================================================== */}
          {/* ALL INTERACTIVE MODALS                                              */}
          {/* =================================================================== */}

          {/* Modal Warga Upload Resi Transfer */}
          {modalType === 'uploadProofWarga' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3.5 bg-brand-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Upload Resi Transfer (Budi Santoso)</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleWargaSubmitProof} className="p-4 space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Pilih Tagihan</label>
                    <select value={wargaUploadForm.billingName} onChange={e=>setWargaUploadForm({...wargaUploadForm, billingName: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1 font-bold">
                      <option>Iuran Keamanan & Kebersihan (Rp 75.000)</option>
                      <option>Kas Rutin RT 17 (Rp 25.000)</option>
                      <option>Sumbangan Perbaikan Lampu Jalan (Rp 20.000)</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Metode Bayar</label>
                    <select value={wargaUploadForm.method} onChange={e=>setWargaUploadForm({...wargaUploadForm, method: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1">
                      <option>QRIS RT 17 / RW 45</option>
                      <option>Transfer Bank Mandiri</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Preset Bukti Transfer</label>
                    <select value={wargaUploadForm.proofPreset} onChange={e=>setWargaUploadForm({...wargaUploadForm, proofPreset: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1 font-mono text-[10px]">
                      <option value="https://placehold.co/300x400/0f2355/ffffff?text=Resi+QRIS+Budi+Santoso">Gunakan Resi QRIS Budi Santoso</option>
                      <option value="https://placehold.co/300x400/163988/ffffff?text=Resi+M-Banking+Mandiri">Gunakan Resi Bank Mandiri</option>
                    </select>
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2 rounded-xl">🚀 Kirim Resi Ke Pak Sarjito</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Admin: Tambah Warga */}
          {modalType === 'addHouse' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3.5 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Tambah Warga & Rumah RT 17</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleAddHouse} className="p-4 space-y-2.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Blok Rumah</label>
                    <input type="text" required placeholder="Contoh: A2/05" value={newHouse.block} onChange={e=>setNewHouse({...newHouse, block: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nama Warga</label>
                    <input type="text" required placeholder="Nama Lengkap" value={newHouse.owner} onChange={e=>setNewHouse({...newHouse, owner: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">No. WhatsApp</label>
                    <input type="text" required placeholder="081234567890" value={newHouse.phone} onChange={e=>setNewHouse({...newHouse, phone: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2 rounded-xl">Simpan Data</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Admin: Tambah Jenis Iuran */}
          {modalType === 'addBilling' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3.5 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Tambah Tarif Jenis Iuran</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleAddBilling} className="p-4 space-y-2.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Nama Iuran</label>
                    <input type="text" required placeholder="Contoh: Iuran Kebersihan Tambahan" value={newBilling.name} onChange={e=>setNewBilling({...newBilling, name: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nominal (Rp)</label>
                    <input type="number" required placeholder="50000" value={newBilling.amount} onChange={e=>setNewBilling({...newBilling, amount: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2 rounded-xl">Simpan Iuran</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Admin: Catat Mutasi Kas */}
          {modalType === 'addTransaction' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3.5 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Catat Mutasi Kas RT 17</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleAddTrx} className="p-4 space-y-2.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Jenis Transaksi</label>
                    <select value={newTrx.type} onChange={e=>setNewTrx({...newTrx, type: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1 font-bold">
                      <option value="Pemasukan">Pemasukan (+ Kas)</option>
                      <option value="Pengeluaran">Pengeluaran (- Kas)</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Kategori</label>
                    <input type="text" required placeholder="Operasional / Kebersihan" value={newTrx.category} onChange={e=>setNewTrx({...newTrx, category: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Uraian / Keterangan</label>
                    <input type="text" required placeholder="Rincian transaksi..." value={newTrx.description} onChange={e=>setNewTrx({...newTrx, description: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nominal (Rp)</label>
                    <input type="number" required placeholder="100000" value={newTrx.amount} onChange={e=>setNewTrx({...newTrx, amount: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2 rounded-xl">Simpan Mutasi</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Admin: Buat Pengumuman */}
          {modalType === 'addAnnouncement' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3.5 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Buat Pengumuman Resmi Pak Sarjito</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleAddAnnouncement} className="p-4 space-y-2.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Judul Pengumuman</label>
                    <input type="text" required placeholder="Judul Pengumuman..." value={newAnnouncement.title} onChange={e=>setNewAnnouncement({...newAnnouncement, title: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Isi Pengumuman</label>
                    <textarea rows="3" required placeholder="Rincian pengumuman..." value={newAnnouncement.content} onChange={e=>setNewAnnouncement({...newAnnouncement, content: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1"></textarea>
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2 rounded-xl">Terbitkan Ke PWA</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Preview Resi Transfer */}
          {modalType === 'viewProof' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-xs w-full overflow-hidden shadow-2xl border">
                <div className="p-3 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Bukti Resi Transfer Warga</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <div className="p-3 flex flex-col items-center space-y-3">
                  <img src={selectedProof} alt="Bukti Resi Transfer" className="rounded-xl border max-h-72 object-cover shadow" />
                  <button onClick={() => setModalType(null)} className="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs">Tutup Pratinjau</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
