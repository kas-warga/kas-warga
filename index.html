<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Warga — RT 05 / RW 02</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Theme Config based on Logo (Deep Royal Blue & Coin Gold) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a', // Deep Royal Blue / Slate Dark
              blue: '#1e3a8a', // Royal Navy Blue
            },
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-400 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL MOCK DATA SET (RT 05 / RW 02) ---
    const INITIAL_HOUSES = [
      { id: 'H01', block: 'A-01', owner: 'Bpk. Budi Santoso', phone: '081234567890', status: 'Tetap', residents: 4, isOccupied: true },
      { id: 'H02', block: 'A-02', owner: 'Ibu Siti Rahma', phone: '081298765432', status: 'Kontrak', residents: 3, isOccupied: true },
      { id: 'H03', block: 'A-03', owner: 'Bpk. Ahmad Dahlan', phone: '081311223344', status: 'Tetap', residents: 5, isOccupied: true },
      { id: 'H04', block: 'B-01', owner: 'Drs. Bambang Wijaya', phone: '081555667788', status: 'Tetap', residents: 2, isOccupied: true },
      { id: 'H05', block: 'B-02', owner: 'Rumah Kosong (Bpk. Roy)', phone: '081700998877', status: 'Kosong', residents: 0, isOccupied: false },
    ];

    const INITIAL_BILLINGS = [
      { id: 'BILL-01', name: 'Iuran Keamanan & Kebersihan', amount: 75000, type: 'Rutin Bulanan', target: 'Semua Warga', status: 'Aktif' },
      { id: 'BILL-02', name: 'Kas Rutin RT 05', amount: 25000, type: 'Rutin Bulanan', target: 'Semua Warga', status: 'Aktif' },
      { id: 'BILL-03', name: 'Sumbangan Perayaan HUT RI', amount: 50000, type: 'Insidental', target: 'Warga Tetap', status: 'Selesai' },
    ];

    const INITIAL_PAYMENTS = [
      { id: 'PAY-101', date: '2026-10-21', house: 'A-01 (Budi Santoso)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Transfer QRIS', status: 'Menunggu Verifikasi', proof: 'https://placehold.co/300x400/1e3a8a/ffffff?text=Bukti+Transfer+QRIS' },
      { id: 'PAY-102', date: '2026-10-20', house: 'A-02 (Siti Rahma)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Transfer Bank BCA', status: 'Menunggu Verifikasi', proof: 'https://placehold.co/300x400/1e3a8a/ffffff?text=Bukti+Transfer+BCA' },
      { id: 'PAY-100', date: '2026-10-18', house: 'A-03 (Ahmad Dahlan)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Tunai (Petugas)', status: 'Terverifikasi', proof: null },
    ];

    const INITIAL_CASHBOOK = [
      { id: 'TRX-001', date: '2026-10-01', type: 'Pemasukan', category: 'Iuran Warga', description: 'Pembayaran Iuran A-03 Ahmad Dahlan', amount: 100000 },
      { id: 'TRX-002', date: '2026-10-05', type: 'Pengeluaran', category: 'Keamanan', description: 'Gaji Petugas Satpam (2 Orang)', amount: 1500000 },
      { id: 'TRX-003', date: '2026-10-10', type: 'Pengeluaran', category: 'Kebersihan', description: 'Pengangkutan Sampah Restribusi DLH', amount: 400000 },
      { id: 'TRX-004', date: '2026-10-15', type: 'Pemasukan', category: 'Sewa Lapangan', description: 'Sewa Lapangan Badminton Warga', amount: 250000 },
    ];

    const INITIAL_REGISTRATIONS = [
      { id: 'REG-01', name: 'Joko Susilo', block: 'B-03', type: 'Warga Baru (Kontrak)', phone: '082199887766', date: '2026-10-20', status: 'Pending' },
      { id: 'REG-02', name: 'Agus Setiawan', block: 'A-04', type: 'Warga Baru (Pindahan)', phone: '085711223344', date: '2026-10-19', status: 'Pending' },
    ];

    // --- REUSABLE BRAND LOGO COMPONENT (EXACT ICON-192 STYLE) ---
    function KasWargaLogo({ className = "w-10 h-10", textSize = "text-xs" }) {
      return (
        <div className={`relative bg-gradient-to-br from-blue-800 via-brand-blue to-slate-900 rounded-2xl p-2 shadow-xl border border-blue-400/30 flex flex-col items-center justify-center text-center overflow-hidden ${className}`}>
          {/* House Vector Outline Silhouette */}
          <div className="flex items-end justify-center gap-1 opacity-90 mb-1">
            <div className="w-3 h-3 bg-white rounded-t-sm relative">
              <div className="absolute -top-1.5 -left-0.5 w-4 h-2 bg-amber-500 clip-triangle" style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}></div>
            </div>
            <div className="w-4 h-4 bg-white rounded-t-sm relative z-10">
              <div className="absolute -top-2 -left-0.5 w-5 h-2.5 bg-orange-600 clip-triangle" style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}></div>
            </div>
            <div className="w-3 h-3 bg-white rounded-t-sm relative">
              <div className="absolute -top-1.5 -left-0.5 w-4 h-2 bg-amber-500 clip-triangle" style={{ clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)' }}></div>
            </div>
          </div>
          
          {/* Golden Coin Rp Badge */}
          <div className="bg-gradient-to-tr from-amber-600 via-gold-400 to-yellow-200 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded-full shadow-lg border border-amber-300 flex items-center justify-center gap-0.5 -mt-2 z-20">
            <span>Rp</span>
          </div>

          {/* Text Title */}
          <span className={`font-black text-white tracking-wider leading-none mt-1 uppercase ${textSize}`}>
            KAS WARGA
          </span>
        </div>
      );
    }

    function App() {
      // System View State: 'landing' | 'admin' | 'warga'
      const [roleMode, setRoleMode] = useState('landing'); // Landing mode, Admin, or PWA
      const [adminPage, setAdminPage] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Data States
      const [houses, setHouses] = useState(INITIAL_HOUSES);
      const [billings, setBillings] = useState(INITIAL_BILLINGS);
      const [payments, setPayments] = useState(INITIAL_PAYMENTS);
      const [cashbook, setCashbook] = useState(INITIAL_CASHBOOK);
      const [registrations, setRegistrations] = useState(INITIAL_REGISTRATIONS);

      // Modal States
      const [modalType, setModalType] = useState(null); // 'addHouse' | 'addBilling' | 'addTransaction' | 'viewProof'
      const [selectedProof, setSelectedProof] = useState(null);

      // Form States
      const [newHouse, setNewHouse] = useState({ block: '', owner: '', phone: '', status: 'Tetap', residents: 3 });
      const [newBilling, setNewBilling] = useState({ name: '', amount: '', type: 'Rutin Bulanan', target: 'Semua Warga' });
      const [newTrx, setNewTrx] = useState({ type: 'Pemasukan', category: 'Iuran Warga', description: '', amount: '' });

      useEffect(() => {
        try {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        } catch (e) {
          console.log("Lucide icons rendering safely");
        }
      });

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      // Financial Calculated Summaries
      const totalIncome = useMemo(() => cashbook.filter(t => t.type === 'Pemasukan').reduce((acc, curr) => acc + Number(curr.amount), 0), [cashbook]);
      const totalExpense = useMemo(() => cashbook.filter(t => t.type === 'Pengeluaran').reduce((acc, curr) => acc + Number(curr.amount), 0), [cashbook]);
      const currentBalance = 24850000 + totalIncome - totalExpense;

      // Handlers
      const handleAddHouse = (e) => {
        e.preventDefault();
        const created = { ...newHouse, id: `H${Date.now()}`, isOccupied: newHouse.status !== 'Kosong', residents: Number(newHouse.residents) };
        setHouses([...houses, created]);
        setModalType(null);
        setNewHouse({ block: '', owner: '', phone: '', status: 'Tetap', residents: 3 });
        showToast('Data rumah & warga berhasil ditambahkan!');
      };

      const handleAddBilling = (e) => {
        e.preventDefault();
        const created = { ...newBilling, id: `BILL-${Date.now()}`, amount: Number(newBilling.amount), status: 'Aktif' };
        setBillings([...billings, created]);
        setModalType(null);
        setNewBilling({ name: '', amount: '', type: 'Rutin Bulanan', target: 'Semua Warga' });
        showToast('Jenis iuran baru telah berhasil dipublikasikan!');
      };

      const handleAddTrx = (e) => {
        e.preventDefault();
        const created = { ...newTrx, id: `TRX-${Date.now()}`, date: new Date().toISOString().split('T')[0], amount: Number(newTrx.amount) };
        setCashbook([created, ...cashbook]);
        setModalType(null);
        setNewTrx({ type: 'Pemasukan', category: 'Iuran Warga', description: '', amount: '' });
        showToast('Transaksi baru berhasil dicatat ke dalam Buku Kas!');
      };

      const handleVerifyPayment = (id, isApprove) => {
        const payment = payments.find(p => p.id === id);
        setPayments(payments.map(p => p.id === id ? { ...p, status: isApprove ? 'Terverifikasi' : 'Ditolak' } : p));
        if (isApprove && payment) {
          // Auto add to cashbook
          const autoTrx = {
            id: `TRX-${Date.now()}`,
            date: new Date().toISOString().split('T')[0],
            type: 'Pemasukan',
            category: 'Iuran Warga',
            description: `Pembayaran ${payment.billing} - ${payment.house}`,
            amount: payment.total
          };
          setCashbook(prev => [autoTrx, ...prev]);
        }
        showToast(isApprove ? 'Pembayaran berhasil diverifikasi & dicatat ke Kas!' : 'Pembayaran ditolak.');
      };

      const handleApproveRegistration = (id) => {
        const reg = registrations.find(r => r.id === id);
        if (reg) {
          const newH = {
            id: `H${Date.now()}`,
            block: reg.block,
            owner: reg.name,
            phone: reg.phone,
            status: reg.type.includes('Kontrak') ? 'Kontrak' : 'Tetap',
            residents: 3,
            isOccupied: true
          };
          setHouses(prev => [...prev, newH]);
        }
        setRegistrations(registrations.filter(r => r.id !== id));
        showToast('Pendaftaran warga disetujui & dimasukkan ke database warga!');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 font-sans">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-amber-400 text-slate-950 font-extrabold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-xs sm:text-sm animate-bounce border-2 border-yellow-200">
              <i data-lucide="check-circle-2" className="w-5 h-5 flex-shrink-0"></i>
              <span>{toast}</span>
            </div>
          )}

          {/* HEADER DEMO SWITCHER BAR */}
          <header className="h-14 bg-brand-blue border-b border-blue-900 flex items-center justify-between px-3 sm:px-6 z-30 flex-shrink-0">
            <div className="flex items-center gap-2 sm:gap-3">
              <div className="bg-amber-400 text-slate-950 font-black rounded-lg px-2.5 py-1 text-xs tracking-wider flex items-center gap-1.5 shadow-lg">
                <i data-lucide="wallet" className="w-4 h-4"></i> KAS WARGA
              </div>
              <span className="text-xs font-semibold text-slate-200 hidden md:inline border-l border-blue-800 pl-3">
                Sistem Keuangan RT/RW Transparan — <strong className="text-amber-300">RT 05 / RW 02</strong>
              </span>
            </div>

            {/* Role / View Mode Switcher */}
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-blue-900 text-[11px] sm:text-xs">
              <button 
                onClick={() => { setRoleMode('landing'); showToast('Kembali ke Menu Awal'); }} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${roleMode === 'landing' ? 'bg-amber-400 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="home" className="w-3.5 h-3.5"></i> Landing
              </button>
              <button 
                onClick={() => { setRoleMode('admin'); showToast('Masuk Portal Admin Pak Sarjito'); }} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${roleMode === 'admin' ? 'bg-amber-400 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="shield-check" className="w-3.5 h-3.5"></i> Admin RT (15 Modul)
              </button>
              <button 
                onClick={() => { setRoleMode('warga'); showToast('Masuk Portal Warga PWA'); }} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${roleMode === 'warga' ? 'bg-amber-400 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="smartphone" className="w-3.5 h-3.5"></i> PWA Warga
              </button>
            </div>
          </header>

          {/* =================================================================== */}
          {/* 1. LANDING PAGE ROLE SELECTOR                                       */}
          {/* =================================================================== */}
          {roleMode === 'landing' && (
            <div className="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 bg-gradient-to-b from-blue-950 via-slate-950 to-slate-950">
              
              <div className="text-center space-y-3 max-w-md mb-8">
                {/* Brand Logo Display */}
                <div className="w-24 h-24 mx-auto mb-2">
                  <KasWargaLogo className="w-full h-full" textSize="text-xs" />
                </div>
                <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight">KAS WARGA</h1>
                <p className="text-xs sm:text-sm text-slate-300">
                  Sistem Keuangan & Iuran RT/RW Transparan<br/>
                  <strong className="text-amber-400">Wilayah RT 05 / RW 02 — Siap Demo Interaktif</strong>
                </p>
              </div>

              {/* 2 Main Role Cards */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full max-w-2xl">
                
                {/* Admin Mode Selection */}
                <div 
                  onClick={() => { setRoleMode('admin'); showToast('Masuk sebagai Pak Sarjito (Ketua RT 05)'); }}
                  className="bg-brand-blue/80 hover:bg-brand-blue border-2 border-blue-500/50 hover:border-amber-400 p-6 rounded-3xl cursor-pointer transition-all transform hover:-translate-y-1 shadow-2xl flex flex-col justify-between group">
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <div className="w-12 h-12 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center font-black">
                        <i data-lucide="shield-check" className="w-6 h-6"></i>
                      </div>
                      <span className="text-[10px] font-bold bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2.5 py-1 rounded-full">
                        15 Modul Interaktif
                      </span>
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white group-hover:text-amber-300 transition">
                        Demo Ketua RT / Pengurus (Pak Sarjito)
                      </h2>
                      <p className="text-xs text-slate-300 mt-1">
                        Portal Admin lengkap dengan 15 modul interaktif untuk pengelolaan iuran, verifikasi resi, buku kas, dan pengumuman warga.
                      </p>
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t border-blue-800 flex items-center justify-between text-xs font-bold text-amber-400">
                    <span>Buka Portal Admin RT</span>
                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                  </div>
                </div>

                {/* Warga PWA Selection */}
                <div 
                  onClick={() => { setRoleMode('warga'); showToast('Masuk sebagai Portal Warga PWA'); }}
                  className="bg-slate-900/80 hover:bg-slate-900 border-2 border-slate-700 hover:border-emerald-500 p-6 rounded-3xl cursor-pointer transition-all transform hover:-translate-y-1 shadow-2xl flex flex-col justify-between group">
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <div className="w-12 h-12 rounded-2xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black">
                        <i data-lucide="smartphone" className="w-6 h-6"></i>
                      </div>
                      <span className="text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                        PWA Mobile
                      </span>
                    </div>
                    <div>
                      <h2 className="text-lg font-bold text-white group-hover:text-emerald-400 transition">
                        Demo Warga / Anggota (Blok A-01)
                      </h2>
                      <p className="text-xs text-slate-300 mt-1">
                        Aplikasi PWA Mobile ringkas warga untuk cek tagihan iuran bulanan, upload bukti transfer, dan cek transparansi kas RT.
                      </p>
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between text-xs font-bold text-emerald-400">
                    <span>Buka PWA Mobile Warga</span>
                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                  </div>
                </div>

              </div>

              <p className="text-[11px] text-slate-500 mt-8 text-center">
                Kas Warga &copy; 2026 — RT 05 / RW 02 (SaaS Platform Ready Demo)
              </p>
            </div>
          )}

          {/* =================================================================== */}
          {/* 2. PORTAL ADMIN (15 FULL INTERACTIVE MODULES)                       */}
          {/* =================================================================== */}
          {roleMode === 'admin' && (
            <div className="flex-1 flex overflow-hidden bg-slate-100 text-slate-800">
              
              {/* SIDEBAR NAVIGATION (15 MENUS FULLY IMPLEMENTED) */}
              <aside className={`
                absolute lg:relative top-0 left-0 bottom-0 z-30 w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 text-xs transition-transform duration-300 ease-in-out
                ${mobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full lg:translate-x-0'}
              `}>
                <div className="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                  <div className="flex items-center gap-2.5">
                    <KasWargaLogo className="w-8 h-8" textSize="text-[8px]" />
                    <div>
                      <h2 className="font-bold text-white text-xs">RT 05 / RW 02</h2>
                      <p className="text-[10px] text-amber-400 font-semibold">Pak Sarjito (Ketua RT)</p>
                    </div>
                  </div>
                  <button onClick={() => setMobileMenuOpen(false)} className="lg:hidden text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-3 space-y-3">
                  
                  {/* Section 1 */}
                  <div>
                    <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Ringkasan</p>
                    <button onClick={() => { setAdminPage('dashboard'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'dashboard' ? 'bg-brand-blue text-white shadow-lg border border-blue-400/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="layout-dashboard" className="w-4 h-4"></i> 1. Dashboard
                    </button>
                  </div>

                  {/* Section 2 */}
                  <div>
                    <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Master Keanggotaan</p>
                    <button onClick={() => { setAdminPage('residents'); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'residents' ? 'bg-brand-blue text-white shadow-lg border border-blue-400/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <span className="flex items-center gap-2.5"><i data-lucide="users" className="w-4 h-4"></i> 2. Data Warga & Rumah</span>
                      <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">{houses.length}</span>
                    </button>
                  </div>

                  {/* Section 3 */}
                  <div>
                    <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Keuangan & Kas RT</p>
                    <button onClick={() => { setAdminPage('billing'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'billing' ? 'bg-brand-blue text-white shadow-lg border border-blue-400/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <i data-lucide="receipt" className="w-4 h-4"></i> 3. Tagihan & Jenis Iuran
                    </button>
                    <button onClick={() => { setAdminPage('payments'); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'payments' ? 'bg-brand-blue text-white shadow-lg border border-blue-400/30' : 'text-slate-400 hover:bg-slate-800'}`}>
                      <span className="flex items-center gap-2.5"><i data-lucide="credit-card" className="w-4 h-4"></i> 4. Verifikasi Pembayaran</span>
                      {payments.filter(p=>p.status==='Menunggu Verifikasi').length > 0 && (
                        <span className="bg-amber-400 text-slate-950 text-[10px] px-2 py-0.5 rounded-full font-black animate-pulse">
                          {payments.filter(p=>p.status==='Menunggu Verifikasi').length}
                        </span>
                      )}
                    </button>
                    <button onClick={() => { setAdminPage('finance'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'finance' ? 'bg-brand-blue text-white shadow-lg border border-blue-400/30' : 'text-slate-400 hover:bg-slate-800'}`}>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nama Pemilik / Kepala Keluarga</label>
                    <input type="text" required placeholder="Nama Lengkap" value={newHouse.owner} onChange={e=>setNewHouse({...newHouse, owner: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">No. WhatsApp Active</label>
                    <input type="text" required placeholder="081234567890" value={newHouse.phone} onChange={e=>setNewHouse({...newHouse, phone: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700">Status Hunian</label>
                      <select value={newHouse.status} onChange={e=>setNewHouse({...newHouse, status: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1">
                        <option value="Tetap">Tetap</option>
                        <option value="Kontrak">Kontrak</option>
                        <option value="Kosong">Kosong</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Jumlah Penghuni</label>
                      <input type="number" value={newHouse.residents} onChange={e=>setNewHouse({...newHouse, residents: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1" />
                    </div>
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2.5 rounded-xl">Simpan Data Warga</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 2: Tambah Jenis Iuran */}
          {modalType === 'addBilling' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border">
                <div className="p-4 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs sm:text-sm">Tambah Tarif / Jenis Iuran Baru</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleAddBilling} className="p-4 space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Nama Iuran</label>
                    <input type="text" required placeholder="Contoh: Kas Duka Cita Warga" value={newBilling.name} onChange={e=>setNewBilling({...newBilling, name: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nominal Tagihan per Rumah (Rp)</label>
                    <input type="number" required placeholder="50000" value={newBilling.amount} onChange={e=>setNewBilling({...newBilling, amount: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700">Sifat Iuran</label>
                      <select value={newBilling.type} onChange={e=>setNewBilling({...newBilling, type: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1">
                        <option value="Rutin Bulanan">Rutin Bulanan</option>
                        <option value="Insidental">Insidental</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700">Target Warga</label>
                      <select value={newBilling.target} onChange={e=>setNewBilling({...newBilling, target: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1">
                        <option value="Semua Warga">Semua Warga</option>
                        <option value="Warga Tetap">Warga Tetap Sahaja</option>
                      </select>
                    </div>
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2.5 rounded-xl">Publikasikan Iuran</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 3: Catat Mutasi Kas */}
          {modalType === 'addTransaction' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border">
                <div className="p-4 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs sm:text-sm">Catat Mutasi Transaksi Kas Baru</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <form onSubmit={handleAddTrx} className="p-4 space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700">Jenis Transaksi</label>
                    <select value={newTrx.type} onChange={e=>setNewTrx({...newTrx, type: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 font-bold">
                      <option value="Pemasukan">Pemasukan (+ Kas)</option>
                      <option value="Pengeluaran">Pengeluaran (- Kas)</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Kategori Pos</label>
                    <input type="text" required placeholder="Contoh: Kebersihan / Keamanan / Donasi" value={newTrx.category} onChange={e=>setNewTrx({...newTrx, category: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Uraian / Keterangan</label>
                    <input type="text" required placeholder="Rincian keterangan transaksi..." value={newTrx.description} onChange={e=>setNewTrx({...newTrx, description: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nominal Transaksi (Rp)</label>
                    <input type="number" required placeholder="100000" value={newTrx.amount} onChange={e=>setNewTrx({...newTrx, amount: e.target.value})} className="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 focus:outline-blue-500" />
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-brand-blue text-white font-bold py-2.5 rounded-xl">Simpan Transaksi</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 4: Lihat Bukti Resi */}
          {modalType === 'viewProof' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3 bg-brand-blue text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Pratinjau Bukti Transfer Resi</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <div className="p-4 flex flex-col items-center space-y-3">
                  <img src={selectedProof} alt="Bukti Resi" className="rounded-xl border max-h-80 object-cover" />
                  <button onClick={() => setModalType(null)} className="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs">Tutup Pratinjau</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
