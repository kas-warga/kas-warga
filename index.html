<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Warga — Interactive Full Menu UI/UX Prototype</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation States
      const [viewMode, setViewMode] = useState('both'); // 'both' | 'desktop' | 'pwa'
      const [adminPage, setAdminPage] = useState('dashboard'); // State untuk Halaman Admin
      const [pwaPage, setPwaPage] = useState('beranda'); // State untuk Halaman PWA Warga
      
      const [selectedProof, setSelectedProof] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-emerald-500 text-slate-950 font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm animate-bounce">
              <i data-lucide="check-circle-2" className="w-5 h-5"></i>
              {toast}
            </div>
          )}

          {/* Top Control Switcher Bar */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 z-20 flex-shrink-0">
            <div className="flex items-center gap-3">
              <div className="bg-emerald-500 text-slate-950 font-black rounded-lg px-2.5 py-1 text-xs tracking-wider">
                KAS WARGA
              </div>
              <span className="text-xs font-semibold text-slate-400 hidden sm:inline">
                Full Interactive Menu Prototype — Klik Menu Mana Saja!
              </span>
            </div>

            {/* View Mode Toggle */}
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
              <button 
                onClick={() => setViewMode('desktop')} 
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition ${viewMode === 'desktop' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="monitor" className="w-4 h-4"></i> Admin (Desktop)
              </button>
              <button 
                onClick={() => setViewMode('both')} 
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition ${viewMode === 'both' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                Split View
              </button>
              <button 
                onClick={() => setViewMode('pwa')} 
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-medium transition ${viewMode === 'pwa' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="smartphone" className="w-4 h-4"></i> Warga (PWA)
              </button>
            </div>
          </header>

          {/* Main Canvas Area */}
          <div className="flex-1 p-4 md:p-6 flex gap-6 overflow-hidden bg-slate-950/80">
            
            {/* ========================================================= */}
            {/* 1. PORTAL ADMIN (DESKTOP VERSION)                         */}
            {/* ========================================================= */}
            {(viewMode === 'both' || viewMode === 'desktop') && (
              <div className="flex-1 bg-slate-100 text-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-800">
                
                {/* Simulated URL Bar */}
                <div className="h-8 bg-slate-200 border-b border-slate-300 flex items-center px-4 gap-2 flex-shrink-0">
                  <div className="flex gap-1.5">
                    <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                    <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                    <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                  </div>
                  <div className="flex-1 text-center">
                    <span className="bg-white/80 px-4 py-0.5 rounded-md text-[11px] text-slate-600 font-mono border border-slate-300">
                      https://bogorvaley.my.id/admin/{adminPage}
                    </span>
                  </div>
                </div>

                <div className="flex-1 flex overflow-hidden">
                  
                  {/* ADMIN SIDEBAR MENU (ALL CLICKABLE) */}
                  <aside className="w-60 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 text-xs flex-shrink-0">
                    <div className="p-4 border-b border-slate-800 flex items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-sm">RT</div>
                      <div>
                        <h2 className="font-bold text-white text-sm">RT 05 / RW 02</h2>
                        <p className="text-[10px] text-emerald-400 font-medium">● Lisensi Aktif</p>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3 space-y-4">
                      
                      {/* Main Navigation */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Utama</p>
                        <button 
                          onClick={() => setAdminPage('dashboard')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'dashboard' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Dashboard
                        </button>
                        <button 
                          onClick={() => setAdminPage('residents')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'residents' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="users" className="w-4 h-4"></i> Data Warga & Rumah
                        </button>
                      </div>

                      {/* Financial Navigation */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Keuangan & Kas</p>
                        <button 
                          onClick={() => setAdminPage('payments')} 
                          className={`w-full flex items-center justify-between px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'payments' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span className="flex items-center gap-2.5"><i data-lucide="credit-card" className="w-4 h-4"></i> Verifikasi</span>
                          <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold">2</span>
                        </button>
                        <button 
                          onClick={() => setAdminPage('finance')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'finance' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="file-text" className="w-4 h-4"></i> Buku Kas & Transaksi
                        </button>
                        <button 
                          onClick={() => setAdminPage('billing')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'billing' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="receipt" className="w-4 h-4"></i> Tagihan & Iuran
                        </button>
                        <button 
                          onClick={() => setAdminPage('reports')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'reports' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Laporan & Tutup Buku
                        </button>
                      </div>

                      {/* Communication & System Navigation */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Komunikasi & Sistem</p>
                        <button 
                          onClick={() => setAdminPage('announcements')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'announcements' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="megaphone" className="w-4 h-4"></i> Pengumuman & LPJ
                        </button>
                        <button 
                          onClick={() => setAdminPage('whatsapp')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'whatsapp' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="message-square" className="w-4 h-4"></i> Integrasi WhatsApp
                        </button>
                        <button 
                          onClick={() => setAdminPage('registrations')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'registrations' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="user-plus" className="w-4 h-4"></i> Pendaftaran Warga
                        </button>
                        <button 
                          onClick={() => setAdminPage('audit')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'audit' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="shield" className="w-4 h-4"></i> Audit Log
                        </button>
                        <button 
                          onClick={() => setAdminPage('license')} 
                          className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'license' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="check-circle-2" className="w-4 h-4"></i> Status Lisensi
                        </button>
                      </div>

                    </div>

                    <div className="p-3 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400">
                      <p className="font-semibold text-white">Pak Budi (Bendahara)</p>
                      <p className="text-[10px] text-slate-500">Sesi Login Terverifikasi</p>
                    </div>
                  </aside>

                  {/* ADMIN DYNAMIC CONTENT VIEW */}
                  <main className="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
                    
                    {/* Top Search Bar */}
                    <div className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
                      <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl w-72 text-xs">
                        <i data-lucide="search" className="w-4 h-4 text-slate-400"></i>
                        <input type="text" placeholder="Cari data di halaman ini..." className="bg-transparent focus:outline-none w-full" />
                      </div>
                      <div className="flex items-center gap-3 text-xs">
                        <button onClick={() => showToast('Notifikasi dibuka')} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl relative text-slate-600">
                          <i data-lucide="bell" className="w-4 h-4"></i>
                          <span className="w-2 h-2 bg-rose-500 rounded-full absolute top-1 right-1"></span>
                        </button>
                        <div className="h-6 w-px bg-slate-200"></div>
                        <span className="font-bold text-slate-700">Portal Admin RT 05</span>
                      </div>
                    </div>

                    {/* DYNAMIC PAGES RENDERER */}
                    <div className="p-6 space-y-6">
                      
                      {/* PAGE 1: DASHBOARD */}
                      {adminPage === 'dashboard' && (
                        <div className="space-y-6">
                          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                              <h1 className="text-xl font-bold text-slate-800">Dashboard Utama Keuangan</h1>
                              <p className="text-xs text-slate-500">Ringkasan arus kas & status verifikasi real-time.</p>
                            </div>
                            <div className="flex gap-2 text-xs">
                              <button onClick={() => showToast('Form Catat Kas dibuka')} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-sm">
                                <i data-lucide="plus" className="w-4 h-4"></i> Catat Kas
                              </button>
                              <button onClick={() => showToast('Export Laporan diproses')} className="bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-sm">
                                <i data-lucide="download" className="w-4 h-4"></i> Export Laporan
                              </button>
                            </div>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-1">
                              <p className="text-slate-500 font-medium">Total Saldo Kas RT</p>
                              <p className="text-xl font-black text-slate-800">Rp 24.850.000</p>
                              <span className="inline-block text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">🟢 Bank & Cash Synchronized</span>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-1">
                              <p className="text-slate-500 font-medium">Pemasukan (Bulan Ini)</p>
                              <p className="text-xl font-black text-emerald-600">Rp 3.200.000</p>
                              <span className="inline-block text-[10px] text-emerald-600 font-bold">↗️ +12% MoM</span>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-1">
                              <p className="text-slate-500 font-medium">Pengeluaran (Bulan Ini)</p>
                              <p className="text-xl font-black text-rose-600">Rp 1.150.000</p>
                              <span className="inline-block text-[10px] text-slate-500 font-bold">3 Kategori Pengeluaran</span>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-1">
                              <p className="text-slate-500 font-medium">Verifikasi Pembayaran</p>
                              <p className="text-xl font-black text-amber-600">2 Antrean</p>
                              <span className="inline-block text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">⚠️ Perlu Tindakan</span>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* PAGE 2: DATA WARGA */}
                      {adminPage === 'residents' && (
                        <div className="space-y-4">
                          <div className="flex justify-between items-center">
                            <div>
                              <h1 className="text-xl font-bold text-slate-800">Data Warga & Rumah</h1>
                              <p className="text-xs text-slate-500">Kelola basis data seluruh anggota RT 05.</p>
                            </div>
                            <button onClick={() => showToast('Form Warga Baru dibuka')} className="bg-emerald-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5">
                              <i data-lucide="plus" className="w-4 h-4"></i> + Tambah Warga
                            </button>
                          </div>

                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden text-xs">
                            <table className="w-full text-left">
                              <thead className="bg-slate-100 text-slate-500 font-semibold border-b border-slate-200">
                                <tr>
                                  <th className="p-3 px-4">Nama Warga</th>
                                  <th className="p-3 px-4">Nomor Rumah</th>
                                  <th className="p-3 px-4">Status HP</th>
                                  <th className="p-3 px-4">Status Akun</th>
                                  <th className="p-3 px-4 text-center">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                <tr>
                                  <td className="p-3 px-4 font-bold">Budi Santoso</td>
                                  <td className="p-3 px-4">Blok A1 No. 02</td>
                                  <td className="p-3 px-4">0812-3456-7890</td>
                                  <td className="p-3 px-4"><span className="bg-emerald-100 text-emerald-800 font-bold text-[10px] px-2 py-0.5 rounded-full">🟢 Aktif</span></td>
                                  <td className="p-3 px-4 text-center">
                                    <button onClick={() => showToast('Edit Warga Budi Santoso')} className="text-emerald-600 font-bold hover:underline">Edit</button>
                                  </td>
                                </tr>
                                <tr>
                                  <td className="p-3 px-4 font-bold">Siti Rahma</td>
                                  <td className="p-3 px-4">Blok B3 No. 10</td>
                                  <td className="p-3 px-4">0819-8765-4321</td>
                                  <td className="p-3 px-4"><span className="bg-emerald-100 text-emerald-800 font-bold text-[10px] px-2 py-0.5 rounded-full">🟢 Aktif</span></td>
                                  <td className="p-3 px-4 text-center">
                                    <button onClick={() => showToast('Edit Warga Siti Rahma')} className="text-emerald-600 font-bold hover:underline">Edit</button>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* PAGE 3: VERIFIKASI PEMBAYARAN */}
                      {adminPage === 'payments' && (
                        <div className="space-y-4">
                          <div>
                            <h1 className="text-xl font-bold text-slate-800">Verifikasi Pembayaran Warga</h1>
                            <p className="text-xs text-slate-500">Periksa bukti transfer dan konfirmasi pembayaran tagihan.</p>
                          </div>

                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden text-xs">
                            <table className="w-full text-left">
                              <thead className="bg-slate-100 text-slate-500 font-semibold border-b border-slate-200">
                                <tr>
                                  <th className="p-3 px-4">Warga & Rumah</th>
                                  <th className="p-3 px-4">Jenis Iuran</th>
                                  <th className="p-3 px-4">Nominal</th>
                                  <th className="p-3 px-4">Resi</th>
                                  <th className="p-3 px-4 text-center">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                <tr>
                                  <td className="p-3 px-4 font-bold">Budi Santoso (A1/02)</td>
                                  <td className="p-3 px-4">Iuran Kebersihan</td>
                                  <td className="p-3 px-4 font-extrabold text-slate-900">Rp 75.000</td>
                                  <td className="p-3 px-4">
                                    <button onClick={() => setSelectedProof({ name: 'Budi Santoso', house: 'A1/02', amount: 'Rp 75.000', type: 'Iuran Kebersihan' })} className="text-emerald-600 font-bold underline">
                                      Preview Resi 🖼️
                                    </button>
                                  </td>
                                  <td className="p-3 px-4 text-center">
                                    <button onClick={() => showToast('Pembayaran Disetujui')} className="bg-emerald-600 text-white font-bold px-2.5 py-1 rounded-lg">Setujui</button>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* PAGE 4: BUKU KAS & TRANSAKSI */}
                      {adminPage === 'finance' && (
                        <div className="space-y-4">
                          <div className="flex justify-between items-center">
                            <div>
                              <h1 className="text-xl font-bold text-slate-800">Buku Kas & Transaksi</h1>
                              <p className="text-xs text-slate-500">Pencatatan resmi seluruh lalu lintas kas RT.</p>
                            </div>
                            <button onClick={() => showToast('Tambah Pemasukan / Pengeluaran')} className="bg-emerald-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl">
                              + Catat Transaksi Baru
                            </button>
                          </div>

                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 text-xs space-y-2">
                            <div className="flex justify-between border-b pb-2 font-bold text-slate-700">
                              <span>Tanggal</span>
                              <span>Kategori</span>
                              <span>Nominal</span>
                              <span>Jenis</span>
                            </div>
                            <div className="flex justify-between py-1 border-b">
                              <span>21 Oct 2026</span>
                              <span>Pembayaran Iuran Warga</span>
                              <span className="font-bold text-emerald-600">+Rp 75.000</span>
                              <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold text-[10px]">Pemasukan</span>
                            </div>
                            <div className="flex justify-between py-1">
                              <span>20 Oct 2026</span>
                              <span>Pembelian Alat Kebersihan</span>
                              <span className="font-bold text-rose-600">-Rp 150.000</span>
                              <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold text-[10px]">Pengeluaran</span>
                            </div>
                          </div>
                        </div>
                      )}

                      					  
					  {/* PAGE 5: PENGATURAN IURAN & TAGIHAN (VERSI LENGKAP & LURUS) */}
					  {adminPage === 'billing' && (
						  <div className="space-y-6">
							
							{/* Header & Akses Cepat Tombol Tambah */}
							<div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
							  <div>
								<h1 className="text-xl font-bold text-slate-800">Pengaturan Iuran & Tagihan</h1>
								<p className="text-xs text-slate-500">Kelola jenis iuran, tarif bulanan warga, dan terbitkan tagihan.</p>
							  </div>
							  
							  {/* Tombol aksi utama yang ditambahkan */}
							  <div className="flex gap-2">
								<button 
								  onClick={() => showToast('Form Tambah Jenis Iuran Baru Dibuka')} 
								  className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition">
