          email: 'admin.baru@kaswarga.id',

        };

        setUsersList([...updatedUsers, newSuperAdmin]);
        setAuditLogs([{ id: `LOG-${Date.now()}`, time: new Date().toLocaleString('id-ID'), user: 'Sistem', action: `Eksekusi Demisioner Periode ${prevPeriod}`, status: 'Sukses' }, ...auditLogs]);
        setModalType(null);
        showToast(`🔒 Hak Akses kepengurusan periode ${prevPeriod} resmi dicabut dan dikunci!`);
      };

      // 3. Simpan Form Edit Hak Akses
      const handleEditUserSubmit = (e) => {
        e.preventDefault();
        // Cek jika ini user baru atau edit
        const existingUser = usersList.find(u => u.id === editUserForm.id);
        if (existingUser) {
          setUsersList(usersList.map(u => u.id === editUserForm.id ? { ...u, ...editUserForm } : u));
          showToast(`✅ Hak akses untuk ${editUserForm.name} berhasil diperbarui!`);

          setUsersList([...usersList, editUserForm]);
          showToast(`✅ Pengurus baru ${editUserForm.name} berhasil ditambahkan!`);
        }
        setModalType(null);
      };

      const handleWargaSubmitProof = (e) => {
        e.preventDefault();
        const generatedPassport = `PT-${Math.floor(1000 + Math.random() * 9000)}`;
        const targetBilling = billings.find(b => b.name === wargaUploadForm.billingName) || billings[0];
        
        const newPayment = {
          id: `PAY-${Date.now()}`,
          passportId: generatedPassport,
          date: new Date().toISOString().split('T')[0],
          house: 'A1/02 (Budi Santoso)',
          billing: targetBilling.name,
          total: targetBilling.amount,
          method: wargaUploadForm.method,
          status: 'Menunggu Verifikasi',
          proof: wargaUploadForm.proofPreset
        };
        setPayments([newPayment, ...payments]);
        setAuditLogs([{ id: `LOG-${Date.now()}`, time: new Date().toLocaleString('id-ID'), user: 'Budi Santoso (Warga)', action: `Upload Resi via PWA (${generatedPassport})`, status: 'Pending' }, ...auditLogs]);

      const handleVerifyPayment = (id, isApprove) => {
        const targetPayment = payments.find(p => p.id === id);
        setPayments(payments.map(p => p.id === id ? { ...p, status: isApprove ? 'Terverifikasi' : 'Ditolak' } : p));
        
        if (isApprove && targetPayment) {
          const autoCashTrx = {
            id: `TRX-${Date.now()}`,
            passportId: targetPayment.passportId,
            date: new Date().toISOString().split('T')[0],
            type: 'Pemasukan',
            category: 'Iuran Warga',
            description: `Pembayaran: ${targetPayment.billing} - ${targetPayment.house}`,
            amount: targetPayment.total
          };
          setCashbook(prev => [autoCashTrx, ...prev]);
        }
        setAuditLogs([{ id: `LOG-${Date.now()}`, time: new Date().toLocaleString('id-ID'), user: 'Pak Sarjito (Admin)', action: `${isApprove ? 'Setujui' : 'Tolak'} Paspor ${targetPayment?.passportId}`, status: 'Sukses' }, ...auditLogs]);

      };

      // Handle adders (House, Billing, Trx, Announcement)
      const handleAddHouse = (e) => { e.preventDefault(); setHouses([{ ...newHouse, id: `H${Date.now()}`, isOccupied: newHouse.status !== 'Kosong', residents: Number(newHouse.residents) }, ...houses]); setModalType(null); showToast('Data warga berhasil ditambahkan!'); };
      const handleAddBilling = (e) => { e.preventDefault(); setBillings([{ ...newBilling, id: `BILL-${Date.now()}`, amount: Number(newBilling.amount), period: 'Bulan Ini', status: 'Aktif' }, ...billings]); setModalType(null); showToast('Jenis iuran baru dipublikasikan!'); };
      const handleAddTrx = (e) => { e.preventDefault(); const generatedPassport = `PT-${Math.floor(1000 + Math.random() * 9000)}`; setCashbook([{ ...newTrx, id: `TRX-${Date.now()}`, passportId: generatedPassport, date: new Date().toISOString().split('T')[0], amount: Number(newTrx.amount) }, ...cashbook]); setModalType(null); showToast(`Mutasi kas tercatat [${generatedPassport}]!`); };
      const handleAddAnnouncement = (e) => { e.preventDefault(); setAnnouncements([{ ...newAnnouncement, id: `ANN-${Date.now()}`, date: new Date().toISOString().split('T')[0], author: 'Admin' }, ...announcements]); setModalType(null); showToast('Pengumuman terbit ke PWA Warga!'); };

        const reg = registrations.find(r => r.id === id);

        { id: 'residents', name: '2. Data Warga & Rumah', icon: 'users' },

        { id: 'reconciliation', name: '7. Rekonsiliasi Bank', icon: 'scale' },
        { id: 'reports', name: '8. Laporan & LPJ', icon: 'file-spreadsheet' },
        { id: 'announcements', name: '9. Kabar & Informasi', icon: 'megaphone' },
        { id: 'whatsapp', name: '10. WhatsApp Broadcast', icon: 'message-square' },
        { id: 'registrations', name: '11. Pendaftaran Baru', icon: 'user-plus', badge: registrations.length },

                            </div>
                            <div className="relative pl-6">
                              <div className={`absolute -left-[11px] top-0 w-5 h-5 rounded-full flex items-center justify-center z-10 ${status === 'Terverifikasi' ? 'bg-emerald-50 border-2 border-emerald-500' : status === 'Menunggu Verifikasi' ? 'bg-amber-100 border-2 border-amber-500 animate-pulse' : 'bg-slate-100 border-2 border-slate-300'}`}>{status === 'Terverifikasi' && <i data-lucide="check" className="w-3 h-3 text-emerald-600"></i>}</div>
                              <h4 className={`font-black text-xs uppercase tracking-wider ${status === 'Terverifikasi' ? 'text-slate-900' : status === 'Menunggu Verifikasi' ? 'text-amber-600' : 'text-slate-400'}`}>3. Verifikasi & Buku Kas</h4>
                              <p className={`text-[10px] font-medium mt-1 ${status === 'Terverifikasi' ? 'text-slate-500' : status === 'Menunggu Verifikasi' ? 'text-amber-600 font-bold' : 'text-slate-400'}`}>{status === 'Terverifikasi' ? 'Telah disahkan pengurus dan dibukukan.' : status === 'Menunggu Verifikasi' ? 'Sedang menunggu pengesahan pengurus.' : 'Menunggu tahap sebelumnya selesai.'}</p>
                            </div>
                            <div className="relative pl-6">
                              <div className={`absolute -left-[11px] top-0 w-5 h-5 rounded-full flex items-center justify-center z-10 ${status === 'Terverifikasi' ? 'bg-emerald-500 border-2 border-emerald-600 shadow-md shadow-emerald-500/40' : 'bg-slate-100 border-2 border-slate-300'}`}>{status === 'Terverifikasi' && <i data-lucide="file-check-2" className="w-3 h-3 text-white"></i>}</div>
                              <h4 className={`font-black text-xs uppercase tracking-wider ${status === 'Terverifikasi' ? 'text-emerald-600' : 'text-slate-400'}`}>4. Resi Pembayaran PDF</h4>
                              <p className={`text-[10px] font-medium mt-1 ${status === 'Terverifikasi' ? 'text-slate-500' : 'text-slate-400'}`}>Dokumen PDF sebagai alat bukti sah.</p>
                            </div>
                          </div>
                        </div>

                        <div className="pt-2">
                          {status === 'Terverifikasi' ? (
                            <button onClick={() => setModalType('resiResmi')} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-lg flex items-center justify-center gap-2 transition transform hover:-translate-y-0.5"><i data-lucide="download" className="w-5 h-5"></i> Unduh Resi Resmi (PDF)</button>
                          ) : status === 'Belum Dibayar' ? (
                            <button onClick={() => { setWargaUploadForm({...wargaUploadForm, billingName: selectedBilling.name}); setModalType('uploadProofWarga'); }} className="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-md flex items-center justify-center gap-2 transition"><i data-lucide="upload" className="w-5 h-5"></i> Upload Resi Pembayaran</button>
                          ) : null}
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            </div>
          )}

          {modalType === 'resiResmi' && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md flex flex-col space-y-3">
                <div className="flex justify-between items-center text-white">
                  <h3 className="font-bold text-sm">Pratinjau PDF Resi</h3>
                  <button onClick={() => setModalType(null)} className="bg-white/20 p-2 rounded-xl hover:bg-white/30 transition"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>

                {(() => {
                  const resiPayment = selectedBilling ? payments.find(p => p.house.includes('Budi Santoso') && p.billing === selectedBilling.name) : null;
                  const passportText = resiPayment ? resiPayment.passportId : 'PT-XXXX';
                  const dateText = resiPayment ? resiPayment.date : 'Belum Ada';
                  const methodText = resiPayment ? resiPayment.method : 'Digital';
                  const amountText = selectedBilling ? selectedBilling.amount.toLocaleString('id-ID') : '0';
                  
                  return (
                    <div className="bg-white rounded-md paper-shadow p-8 relative overflow-hidden font-serif border border-slate-200">
                      <div className="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none z-0"><span className="text-[6rem] font-black rotate-[-30deg] tracking-widest text-slate-900 whitespace-nowrap">LUNAS SAH</span></div>
                      <div className="relative z-10 space-y-6">
                        <div className="border-b-2 border-slate-800 pb-4 text-center">
                          <h2 className="text-xl font-black text-slate-900 tracking-wider">RESI PEMBAYARAN RESMI</h2>
                          <p className="text-xs text-slate-600 mt-1 font-sans font-medium">Sistem Keuangan Lingkungan RT {housingProfile.rt} / RW {housingProfile.rw}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4 text-[10px] text-slate-800 font-sans">
                          <div><p className="text-slate-500">Paspor Transaksi:</p><p className="font-black text-sm">{passportText}</p></div>
                          <div className="text-right"><p className="text-slate-500">Tanggal Terbit:</p><p className="font-black text-sm">{dateText}</p></div>
                        </div>
                        <div className="bg-slate-50 p-4 border border-slate-200 text-xs font-sans space-y-2 rounded">
                          <div className="flex justify-between"><span className="text-slate-500">Diterima Dari:</span><strong className="text-slate-900">Budi Santoso (A1/02)</strong></div>
                          <div className="flex justify-between"><span className="text-slate-500">Keterangan:</span><strong className="text-slate-900 text-right">{selectedBilling ? selectedBilling.name : 'Iuran Kas'}<br/>(Periode Okt 2026)</strong></div>
                          <div className="flex justify-between border-t border-slate-200 pt-2 mt-2"><span className="text-slate-500">Via Pembayaran:</span><strong className="text-slate-900">{methodText}</strong></div>
                        </div>
                        <div className="text-center bg-brand-50 border-y border-brand-200 py-3 font-sans">
                          <p className="text-[10px] text-brand-700 font-bold uppercase tracking-widest">Total Sah & Terbukukan</p>
                          <p className="text-2xl font-black text-slate-900 mt-1">Rp {amountText}</p>
                        </div>
                        <div className="flex justify-between items-end pt-4">
                          <div className="w-20 h-20 border-2 border-emerald-600 rounded flex flex-col items-center justify-center bg-emerald-50 text-emerald-700 font-sans p-1 text-center transform -rotate-2 shadow-sm"><i data-lucide="qr-code" className="w-8 h-8 opacity-80 mb-1"></i><span className="text-[6px] font-black uppercase leading-tight">TERVERIFIKASI TERCATAT BUKU KAS</span></div>
                          <div className="text-right font-sans text-[10px]"><p className="text-slate-500">Disahkan Oleh Sistem,</p><p className="font-black text-slate-900 mt-6 border-b border-slate-300 inline-block px-4 pb-1">Admin</p><p className="text-slate-500 mt-1">Ketua RT / Bendahara</p></div>
                        </div>
                      </div>
                    </div>
                  );
                })()}
                <button onClick={() => showToast('File PDF sedang diunduh ke perangkat Anda...')} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition"><i data-lucide="download" className="w-5 h-5"></i> SIMPAN PDF (UNDUH)</button>
              </div>
            </div>
          )}

          {modalType === 'uploadProofWarga' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center"><h3 className="font-black text-sm text-slate-900">Lapor Resi Bayar</h3><button onClick={() => setModalType(null)} className="text-slate-400 hover:text-slate-800 bg-white p-1 rounded-md border shadow-sm"><i data-lucide="x" className="w-5 h-5"></i></button></div>
                <form onSubmit={handleWargaSubmitProof} className="p-5 space-y-4 text-xs font-medium">
                  <div><label className="font-bold text-slate-700">Pilih Tagihan</label><select value={wargaUploadForm.billingName} onChange={e=>setWargaUploadForm({...wargaUploadForm, billingName: e.target.value})} className="w-full bg-white border border-slate-300 p-3 rounded-xl mt-1.5 shadow-sm font-bold focus:ring-2 focus:ring-brand-500 outline-none">{billings.map(b => <option key={b.id} value={b.name}>{b.name}</option>)}</select></div>
                  <div><label className="font-bold text-slate-700">Metode Bayar (Simulasi)</label><select value={wargaUploadForm.method} onChange={e=>setWargaUploadForm({...wargaUploadForm, method: e.target.value})} className="w-full bg-white border border-slate-300 p-3 rounded-xl mt-1.5 shadow-sm focus:ring-2 focus:ring-brand-500 outline-none"><option>Transfer QRIS</option><option>Bank Mandiri</option></select></div>
                  <div className="pt-3 flex gap-3"><button type="submit" className="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-black py-3.5 rounded-xl shadow-md transition">🚀 Ajukan Verifikasi</button><button type="button" onClick={() => setModalType(null)} className="bg-slate-100 text-slate-600 font-bold px-4 py-3.5 rounded-xl hover:bg-slate-200 border border-slate-200">Batal</button></div>
                </form>
              </div>
            </div>
          )}

          {modalType === 'jejakPaspor' && !selectedBilling && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-200 relative">
                <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center relative overflow-hidden"><div className="absolute right-0 top-0 w-24 h-24 bg-brand-50 rounded-bl-full pointer-events-none"></div><div><h3 className="font-black text-sm text-slate-900">Kronologi Transaksi</h3><p className="text-[10px] text-brand-600 font-bold bg-brand-50 px-2 py-0.5 rounded border border-brand-100 inline-block mt-1 shadow-sm"><i data-lucide="fingerprint" className="w-2.5 h-2.5 inline mb-0.5"></i> {selectedPassport}</p></div><button onClick={() => setModalType(null)} className="text-slate-400 hover:text-slate-700 bg-white p-1.5 rounded-lg border shadow-sm z-10"><i data-lucide="x" className="w-5 h-5"></i></button></div>
                <div className="p-6">
                  <div className="relative border-l-2 border-slate-200 ml-3 space-y-6">
                    <div className="relative pl-6"><div className="absolute -left-[11px] top-0 w-5 h-5 rounded-full bg-emerald-50 border-2 border-emerald-500 flex items-center justify-center z-10"><i data-lucide="check" className="w-3 h-3 text-emerald-600"></i></div><h4 className="font-black text-slate-900 text-xs uppercase tracking-wider">1. Tagihan Terbit</h4><p className="text-[10px] text-slate-500 font-medium mt-1">Diterbitkan oleh sistem sesuai tarif & periode.</p></div>
                    <div className="relative pl-6"><div className="absolute -left-[11px] top-0 w-5 h-5 rounded-full bg-emerald-50 border-2 border-emerald-500 flex items-center justify-center z-10"><i data-lucide="check" className="w-3 h-3 text-emerald-600"></i></div><h4 className="font-black text-slate-900 text-xs uppercase tracking-wider">2. Bayar Dilaporkan</h4><p className="text-[10px] text-slate-500 font-medium mt-1">Warga mengunggah bukti resi via PWA.</p></div>
                    <div className="relative pl-6"><div className="absolute -left-[11px] top-0 w-5 h-5 rounded-full bg-emerald-50 border-2 border-emerald-500 flex items-center justify-center z-10"><i data-lucide="check" className="w-3 h-3 text-emerald-600"></i></div><h4 className="font-black text-slate-900 text-xs uppercase tracking-wider">3. Diverifikasi & Dibukukan</h4><p className="text-[10px] text-slate-500 font-medium mt-1">Pengurus mengesahkan dan otomatis masuk Buku Kas.</p></div>
                    <div className="relative pl-6"><div className="absolute -left-[11px] top-0 w-5 h-5 rounded-full bg-emerald-500 border-2 border-emerald-600 flex items-center justify-center z-10 shadow-md shadow-emerald-500/40"><i data-lucide="file-check-2" className="w-3 h-3 text-white"></i></div><h4 className="font-black text-emerald-600 text-xs uppercase tracking-wider">4. Resi Resmi Tersedia</h4><p className="text-[10px] text-slate-500 font-medium mt-1">Dokumen PDF LUNAS SAH siap diunduh warga.</p></div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
