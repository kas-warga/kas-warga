<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Warga — Full Interactive Demo Prototype</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL MOCK DATA ---
    const INITIAL_HOUSES = [
      { id: 'H01', block: 'A-01', owner: 'Bpk. Ahmad Subagja', phone: '081234567890', status: 'Tetap', residents: 4, isOccupied: true },
      { id: 'H02', block: 'A-02', owner: 'Ibu Ratna Sari', phone: '081298765432', status: 'Kontrak', residents: 3, isOccupied: true },
      { id: 'H03', block: 'A-03', owner: 'Bpk. Hendra Gunawan', phone: '081311223344', status: 'Tetap', residents: 5, isOccupied: true },
      { id: 'H04', block: 'B-01', owner: 'Drs. Bambang Wijaya', phone: '081555667788', status: 'Tetap', residents: 2, isOccupied: true },
      { id: 'H05', block: 'B-02', owner: 'Rumah Kosong (Bpk. Roy)', phone: '081700998877', status: 'Kosong', residents: 0, isOccupied: false },
    ];

    const INITIAL_BILLINGS = [
      { id: 'BILL-01', name: 'Iuran Keamanan & Kebersihan', amount: 75000, type: 'Rutin Bulanan', target: 'Semua Warga', status: 'Aktif' },
      { id: 'BILL-02', name: 'Kas Rutin RT 05', amount: 25000, type: 'Rutin Bulanan', target: 'Semua Warga', status: 'Aktif' },
      { id: 'BILL-03', name: 'Sumbangan Perayaan HUT RI', amount: 50000, type: 'Insidental', target: 'Warga Tetap', status: 'Selesai' },
    ];

    const INITIAL_PAYMENTS = [
      { id: 'PAY-101', date: '2026-10-21', house: 'A-01 (Ahmad Subagja)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Transfer QRIS', status: 'Menunggu Verifikasi', proof: 'https://placehold.co/300x400/e2e8f0/1e293b?text=Bukti+Transfer+QRIS' },
      { id: 'PAY-102', date: '2026-10-20', house: 'A-02 (Ratna Sari)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Transfer Bank', status: 'Menunggu Verifikasi', proof: 'https://placehold.co/300x400/e2e8f0/1e293b?text=Bukti+Transfer+BCA' },
      { id: 'PAY-100', date: '2026-10-18', house: 'A-03 (Hendra Gunawan)', billing: 'Iuran Kebersihan & Kas (Okt 2026)', total: 100000, method: 'Tunai (Petugas)', status: 'Terverifikasi', proof: null },
    ];

    const INITIAL_CASHBOOK = [
      { id: 'TRX-001', date: '2026-10-01', type: 'Pemasukan', category: 'Iuran Warga', description: 'Pembayaran Iuran A-03 Hendra', amount: 100000 },
      { id: 'TRX-002', date: '2026-10-05', type: 'Pengeluaran', category: 'Keamanan', description: 'Gaji Petugas Satpam (2 Orang)', amount: 3000000 },
      { id: 'TRX-003', date: '2026-10-10', type: 'Pengeluaran', category: 'Kebersihan', description: 'Pengangkutan Sampah Restribusi', amount: 1200000 },
      { id: 'TRX-004', date: '2026-10-15', type: 'Pemasukan', category: 'Sewa Lapangan', description: 'Sewa Lapangan Badminton Warga', amount: 350000 },
    ];

    const INITIAL_REGISTRATIONS = [
      { id: 'REG-01', name: 'Siti Rahmawati', block: 'B-03', type: 'Warga Baru (Kontrak)', phone: '082199887766', date: '2026-10-20', status: 'Pending' },
      { id: 'REG-02', name: 'Agus Setiawan', block: 'A-04', type: 'Warga Baru (Pindahan)', phone: '085711223344', date: '2026-10-19', status: 'Pending' },
    ];

    function App() {
      // System Navigation & View Mode State
      const [viewMode, setViewMode] = useState('responsive'); // 'responsive' | 'desktop' | 'pwa'
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [adminPage, setAdminPage] = useState('dashboard');
      const [toast, setToast] = useState(null);

      // Data States
      const [houses, setHouses] = useState(INITIAL_HOUSES);
      const [billings, setBillings] = useState(INITIAL_BILLINGS);
      const [payments, setPayments] = useState(INITIAL_PAYMENTS);
      const [cashbook, setCashbook] = useState(INITIAL_CASHBOOK);
      const [registrations, setRegistrations] = useState(INITIAL_REGISTRATIONS);

      // Modal States
      const [modalType, setModalType] = useState(null); // 'addHouse' | 'addBilling' | 'addTransaction' | 'viewProof'
      const [selectedProof, setSelectedProof] = useState(null);

      // Form States
      const [newHouse, setNewHouse] = useState({ block: '', owner: '', phone: '', status: 'Tetap', residents: 3 });
      const [newBilling, setNewBilling] = useState({ name: '', amount: '', type: 'Rutin Bulanan', target: 'Semua Warga' });
      const [newTrx, setNewTrx] = useState({ type: 'Pemasukan', category: 'Iuran Warga', description: '', amount: '' });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      // Financial Calculated Summaries
      const totalIncome = useMemo(() => cashbook.filter(t => t.type === 'Pemasukan').reduce((acc, curr) => acc + Number(curr.amount), 0), [cashbook]);
      const totalExpense = useMemo(() => cashbook.filter(t => t.type === 'Pengeluaran').reduce((acc, curr) => acc + Number(curr.amount), 0), [cashbook]);
      const currentBalance = 24500000 + totalIncome - totalExpense;

      // Handlers
      const handleAddHouse = (e) => {
        e.preventDefault();
        const created = { ...newHouse, id: `H${Date.now()}`, isOccupied: newHouse.status !== 'Kosong', residents: Number(newHouse.residents) };
        setHouses([...houses, created]);
        setModalType(null);
        setNewHouse({ block: '', owner: '', phone: '', status: 'Tetap', residents: 3 });
        showToast('Data rumah & warga berhasil ditambahkan!');
      };

      const handleAddBilling = (e) => {
        e.preventDefault();
        const created = { ...newBilling, id: `BILL-${Date.now()}`, amount: Number(newBilling.amount), status: 'Aktif' };
        setBillings([...billings, created]);
        setModalType(null);
        setNewBilling({ name: '', amount: '', type: 'Rutin Bulanan', target: 'Semua Warga' });
        showToast('Jenis iuran baru telah berhasil dipublikasikan!');
      };

      const handleAddTrx = (e) => {
        e.preventDefault();
        const created = { ...newTrx, id: `TRX-${Date.now()}`, date: new Date().toISOString().split('T')[0], amount: Number(newTrx.amount) };
        setCashbook([created, ...cashbook]);
        setModalType(null);
        setNewTrx({ type: 'Pemasukan', category: 'Iuran Warga', description: '', amount: '' });
        showToast('Transaksi baru dicatat ke dalam Buku Kas!');
      };

      const handleVerifyPayment = (id, isApprove) => {
        setPayments(payments.map(p => p.id === id ? { ...p, status: isApprove ? 'Terverifikasi' : 'Ditolak' } : p));
        showToast(isApprove ? 'Pembayaran berhasil diverifikasi!' : 'Pembayaran ditolak.');
      };

      const handleApproveRegistration = (id) => {
        setRegistrations(registrations.filter(r => r.id !== id));
        showToast('Pendaftaran warga disetujui & dimasukkan ke database!');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 font-sans">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-emerald-500 text-slate-950 font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-xs sm:text-sm animate-bounce border border-emerald-300">
              <i data-lucide="check-circle-2" className="w-5 h-5 flex-shrink-0"></i>
              <span>{toast}</span>
            </div>
          )}

          {/* HEADER DEMO SWITCHER BAR */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 sm:px-6 z-30 flex-shrink-0">
            <div className="flex items-center gap-2 sm:gap-3">
              <div className="bg-emerald-500 text-slate-950 font-black rounded-lg px-2.5 py-1 text-xs tracking-wider flex items-center gap-1.5 shadow-lg shadow-emerald-500/20">
                <i data-lucide="wallet" className="w-4 h-4"></i> KAS WARGA
              </div>
              <span className="text-xs font-semibold text-slate-300 hidden md:inline border-l border-slate-700 pl-3">
                Sistem Manajemen Kas & Warga RT/RW (Siap Demo)
              </span>
            </div>

            {/* View Mode Toggle */}
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] sm:text-xs">
              <button 
                onClick={() => setViewMode('responsive')} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${viewMode === 'responsive' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="layout" className="w-3.5 h-3.5"></i> Admin (Responsive)
              </button>
              <button 
                onClick={() => setViewMode('pwa')} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${viewMode === 'pwa' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="smartphone" className="w-3.5 h-3.5"></i> Portal Warga (PWA)
              </button>
            </div>
          </header>

          {/* CANVAS MAIN CONTAINER */}
          <div className="flex-1 flex overflow-hidden p-2 sm:p-4 md:p-6 bg-slate-950 justify-center">
            
            {/* PORTAL ADMIN */}
            {(viewMode === 'responsive' || viewMode === 'desktop') && (
              <div className="w-full max-w-7xl bg-slate-100 text-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-800">
                
                {/* Browser Bar Simulation */}
                <div className="h-10 bg-slate-200 border-b border-slate-300 flex items-center justify-between px-3 sm:px-4 flex-shrink-0">
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                      className="lg:hidden p-1.5 bg-slate-900 text-white hover:bg-slate-800 rounded-lg flex items-center gap-1.5 text-xs font-bold">
                      <i data-lucide="menu" className="w-4 h-4"></i> 15 Menu Admin
                    </button>
                    <div className="hidden sm:flex gap-1.5">
                      <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                      <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                      <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                  </div>
                  <div className="text-center truncate px-2">
                    <span className="bg-white/80 px-3 py-0.5 rounded-md text-[10px] sm:text-[11px] text-slate-600 font-mono border border-slate-300 truncate inline-block max-w-[180px] sm:max-w-none">
                      https://kaswarga.id/rt05/admin/{adminPage}
                    </span>
                  </div>
                  <div className="text-[10px] font-extrabold text-emerald-800 bg-emerald-200/80 px-2 py-0.5 rounded flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-ping"></span>
                    RT 05 / RW 02
                  </div>
                </div>

                <div className="flex-1 flex overflow-hidden relative">
                  
                  {/* SIDEBAR NAVIGATION (15 MENU UTUH FULL FUNCTIONAL) */}
                  <aside className={`
                    absolute lg:relative top-0 left-0 bottom-0 z-20 w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 text-xs transition-transform duration-300 ease-in-out
                    ${mobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full lg:translate-x-0'}
                  `}>
                    <div className="p-3.5 border-b border-slate-800 flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-black text-sm">RT</div>
                        <div>
                          <h2 className="font-bold text-white text-xs sm:text-sm">Portal RT 05 / RW 02</h2>
                          <p className="text-[10px] text-emerald-400 font-medium">● System Online & Active</p>
                        </div>
                      </div>
                      <button onClick={() => setMobileMenuOpen(false)} className="lg:hidden text-slate-400 hover:text-white p-1">
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3 space-y-3">
                      
                      {/* Section 1: Dashboard */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Ringkasan</p>
                        <button onClick={() => { setAdminPage('dashboard'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'dashboard' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="layout-dashboard" className="w-4 h-4"></i> 1. Dashboard
                        </button>
                      </div>

                      {/* Section 2: Keanggotaan */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Master Data Warga</p>
                        <button onClick={() => { setAdminPage('residents'); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'residents' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span className="flex items-center gap-2.5"><i data-lucide="users" className="w-4 h-4"></i> 2. Data Warga & Rumah</span>
                          <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-bold">{houses.length}</span>
                        </button>
                      </div>

                      {/* Section 3: Keuangan */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Modul Keuangan & Kas</p>
                        <button onClick={() => { setAdminPage('billing'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'billing' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="receipt" className="w-4 h-4"></i> 3. Tagihan & Jenis Iuran
                        </button>
                        <button onClick={() => { setAdminPage('payments'); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'payments' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span className="flex items-center gap-2.5"><i data-lucide="credit-card" className="w-4 h-4"></i> 4. Verifikasi Pembayaran</span>
                          {payments.filter(p=>p.status==='Menunggu Verifikasi').length > 0 && (
                            <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-black animate-pulse">
                              {payments.filter(p=>p.status==='Menunggu Verifikasi').length}
                            </span>
                          )}
                        </button>
                        <button onClick={() => { setAdminPage('finance'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'finance' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="book-open" className="w-4 h-4"></i> 5. Buku Kas & Transaksi
                        </button>
                        <button onClick={() => { setAdminPage('expenses'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'expenses' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="pie-chart" className="w-4 h-4"></i> 6. Pos Pengeluaran
                        </button>
                        <button onClick={() => { setAdminPage('reconciliation'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'reconciliation' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="scale" className="w-4 h-4"></i> 7. Rekonsiliasi Saldo Bank
                        </button>
                        <button onClick={() => { setAdminPage('reports'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'reports' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> 8. Laporan & Tutup Buku
                        </button>
                      </div>

                      {/* Section 4: Komunikasi */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Komunikasi & Publikasi</p>
                        <button onClick={() => { setAdminPage('announcements'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'announcements' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="megaphone" className="w-4 h-4"></i> 9. Pengumuman & LPJ
                        </button>
                        <button onClick={() => { setAdminPage('whatsapp'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'whatsapp' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="message-square" className="w-4 h-4"></i> 10. Integrasi WhatsApp Gateway
                        </button>
                      </div>

                      {/* Section 5: Pengaturan Sistem */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1 tracking-wider">Pengaturan & Keamanan</p>
                        <button onClick={() => { setAdminPage('registrations'); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'registrations' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span className="flex items-center gap-2.5"><i data-lucide="user-plus" className="w-4 h-4"></i> 11. Pendaftaran Warga Baru</span>
                          {registrations.length > 0 && <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full">{registrations.length}</span>}
                        </button>
                        <button onClick={() => { setAdminPage('registration-links'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'registration-links' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="link" className="w-4 h-4"></i> 12. Link Form Mandiri Warga
                        </button>
                        <button onClick={() => { setAdminPage('users'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'users' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="shield-check" className="w-4 h-4"></i> 13. Manajemen Pengurus & Akses
                        </button>
                        <button onClick={() => { setAdminPage('audit'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'audit' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="history" className="w-4 h-4"></i> 14. Audit Log Aktivitas
                        </button>
                        <button onClick={() => { setAdminPage('license'); setMobileMenuOpen(false); }} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl font-semibold transition text-left ${adminPage === 'license' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="badge-check" className="w-4 h-4"></i> 15. Status Lisensi Aplikasi
                        </button>
                      </div>

                    </div>

                    <div className="p-3 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400 flex items-center gap-2.5">
                      <div className="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-white text-xs">B</div>
                      <div>
                        <p className="font-bold text-white leading-tight">Bpk. Budi Santoso</p>
                        <p className="text-[10px] text-emerald-400">Bendahara RT (Online)</p>
                      </div>
                    </div>
                  </aside>

                  {/* Backdrop Overlay Mobile Navigation */}
                  {mobileMenuOpen && (
                    <div onClick={() => setMobileMenuOpen(false)} className="fixed inset-0 bg-slate-950/70 z-10 lg:hidden backdrop-blur-sm"></div>
                  )}

                  {/* MAIN CONTENT WORKSPACE */}
                  <main className="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
                    
                    {/* Top Admin Bar */}
                    <div className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 flex-shrink-0 sticky top-0 z-10">
                      <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl w-48 sm:w-80 text-xs">
                        <i data-lucide="search" className="w-4 h-4 text-slate-400 flex-shrink-0"></i>
                        <input type="text" placeholder="Cari nama warga, nomor rumah, transaksi..." className="bg-transparent focus:outline-none w-full text-slate-700" />
                      </div>
                      <div className="flex items-center gap-2 sm:gap-3 text-xs">
                        <button onClick={() => showToast('Notifikasi: 2 Konfirmasi Pembayaran Baru Masuk!')} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl relative text-slate-600 transition">
                          <i data-lucide="bell" className="w-4 h-4"></i>

                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Kategori Pos</label>
                    <input type="text" required placeholder="Contoh: Kebersihan / Keamanan / Donasi" value={newTrx.category} onChange={e=>setNewTrx({...newTrx, category: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1 focus:outline-emerald-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Uraian / Keterangan</label>
                    <input type="text" required placeholder="Rincian keterangan transaksi..." value={newTrx.description} onChange={e=>setNewTrx({...newTrx, description: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1 focus:outline-emerald-500" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700">Nominal Transaksi (Rp)</label>
                    <input type="number" required placeholder="100000" value={newTrx.amount} onChange={e=>setNewTrx({...newTrx, amount: e.target.value})} className="w-full bg-slate-50 border p-2 rounded-xl mt-1 focus:outline-emerald-500" />
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-xl">Simpan Transaksi</button>
                    <button type="button" onClick={() => setModalType(null)} className="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl">Batal</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 4: Lihat Bukti Resi */}
          {modalType === 'viewProof' && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border">
                <div className="p-3 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs">Pratinjau Bukti Transfer Resi</h3>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <div className="p-4 flex flex-col items-center space-y-3">
                  <img src={selectedProof} alt="Bukti Resi" className="rounded-xl border max-h-80 object-cover" />
                  <button onClick={() => setModalType(null)} className="w-full bg-slate-900 text-white font-bold py-2 rounded-xl text-xs">Tutup Pratinjau</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
