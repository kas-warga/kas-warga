<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Warga — Full 15 Menus Responsive Prototype</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Responsive & Navigation States
      const [viewMode, setViewMode] = useState('responsive'); // 'responsive' | 'desktop' | 'pwa'
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      
      const [adminPage, setAdminPage] = useState('billing'); // Default ke 'billing'
      const [pwaPage, setPwaPage] = useState('tagihan');
      
      const [showAddIuranModal, setShowAddIuranModal] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const navigateAdmin = (pageName) => {
        setAdminPage(pageName);
        setMobileMenuOpen(false); // Tutup drawer menu saat diklik di layar hp
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 bg-emerald-500 text-slate-950 font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm animate-bounce">
              <i data-lucide="check-circle-2" className="w-5 h-5"></i>
              {toast}
            </div>
          )}

          {/* Header Switcher Bar */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 sm:px-6 z-30 flex-shrink-0">
            <div className="flex items-center gap-2 sm:gap-3">
              <div className="bg-emerald-500 text-slate-950 font-black rounded-lg px-2.5 py-1 text-xs tracking-wider">
                KAS WARGA
              </div>
              <span className="text-xs font-semibold text-slate-300 hidden md:inline">
                Sistem Kas Warga — 15 Menu Admin Lengkap & Responsif
              </span>
            </div>

            {/* View Mode Toggle */}
            <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] sm:text-xs">
              <button 
                onClick={() => setViewMode('responsive')} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${viewMode === 'responsive' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="layout" className="w-3.5 h-3.5"></i> Responsif (Auto)
              </button>
              <button 
                onClick={() => setViewMode('desktop')} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${viewMode === 'desktop' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="monitor" className="w-3.5 h-3.5"></i> Desktop
              </button>
              <button 
                onClick={() => setViewMode('pwa')} 
                className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium transition ${viewMode === 'pwa' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <i data-lucide="smartphone" className="w-3.5 h-3.5"></i> PWA Warga
              </button>
            </div>
          </header>

          {/* Canvas Main Container */}
          <div className="flex-1 flex overflow-hidden p-2 sm:p-4 md:p-6 bg-slate-950/80 justify-center">
            
            {/* ------------------------------------------------------------- */}
            {/* PORTAL ADMIN (RESPONSIF + 15 MENU UTUH)                      */}
            {/* ------------------------------------------------------------- */}
            {(viewMode === 'responsive' || viewMode === 'desktop') && (
              <div className="w-full max-w-7xl bg-slate-100 text-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col border border-slate-800">
                
                {/* Browser Top Navigation Simulation */}
                <div className="h-9 bg-slate-200 border-b border-slate-300 flex items-center justify-between px-4 flex-shrink-0">
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                      className="lg:hidden p-1.5 bg-slate-900 text-white hover:bg-slate-800 rounded-lg flex items-center gap-1 text-xs font-bold">
                      <i data-lucide="menu" className="w-4 h-4"></i> Menu Admin
                    </button>
                    <div className="hidden sm:flex gap-1.5">
                      <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                      <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                      <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                  </div>
                  <div className="text-center truncate px-2">
                    <span className="bg-white/80 px-3 py-0.5 rounded-md text-[10px] sm:text-[11px] text-slate-600 font-mono border border-slate-300 truncate inline-block max-w-[200px] sm:max-w-none">
                      https://bogorvaley.my.id/admin/{adminPage}
                    </span>
                  </div>
                  <div className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">
                    RT 05 / RW 02
                  </div>
                </div>

                <div className="flex-1 flex overflow-hidden relative">
                  
                  {/* ================= SIDEBAR NAV (SELURUH 15 MENU LENGKAP) ================= */}
                  <aside className={`
                    absolute lg:relative top-0 left-0 bottom-0 z-20 w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 text-xs transition-transform duration-300 ease-in-out
                    ${mobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full lg:translate-x-0'}
                  `}>
                    <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-sm">RT</div>
                        <div>
                          <h2 className="font-bold text-white text-sm">Portal Admin RT 05</h2>
                          <p className="text-[10px] text-emerald-400 font-medium">● Lisensi Aktif</p>
                        </div>
                      </div>
                      <button onClick={() => setMobileMenuOpen(false)} className="lg:hidden text-slate-400 hover:text-white">
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3 space-y-4">
                      
                      {/* Section 1: Dashboard */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Main</p>
                        <button onClick={() => navigateAdmin('dashboard')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'dashboard' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="layout-dashboard" className="w-4 h-4"></i> 1. Dashboard
                        </button>
                      </div>

                      {/* Section 2: Keanggotaan & Warga */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Warga & Rumah</p>
                        <button onClick={() => navigateAdmin('residents')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'residents' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="users" className="w-4 h-4"></i> 2. Data Warga & Rumah
                        </button>
                      </div>

                      {/* Section 3: Keuangan & Kas */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Keuangan & Kas</p>
                        <button onClick={() => navigateAdmin('billing')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'billing' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="receipt" className="w-4 h-4"></i> 3. Tagihan & Iuran
                        </button>
                        <button onClick={() => navigateAdmin('payments')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'payments' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <span className="flex items-center gap-2.5"><i data-lucide="credit-card" className="w-4 h-4"></i> 4. Verifikasi Bayar</span>
                          <span className="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full font-extrabold">2</span>
                        </button>
                        <button onClick={() => navigateAdmin('finance')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'finance' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="file-text" className="w-4 h-4"></i> 5. Buku Kas & Transaksi
                        </button>
                        <button onClick={() => navigateAdmin('expenses')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'expenses' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="trending-down" className="w-4 h-4"></i> 6. Pengeluaran & Anggaran
                        </button>
                        <button onClick={() => navigateAdmin('reconciliation')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'reconciliation' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="scale" className="w-4 h-4"></i> 7. Rekonsiliasi Saldo
                        </button>
                        <button onClick={() => navigateAdmin('reports')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'reports' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> 8. Laporan & Tutup Buku
                        </button>
                      </div>

                      {/* Section 4: Komunikasi */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Informasi & Komunikasi</p>
                        <button onClick={() => navigateAdmin('announcements')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'announcements' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="megaphone" className="w-4 h-4"></i> 9. Pengumuman & LPJ
                        </button>
                        <button onClick={() => navigateAdmin('whatsapp')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'whatsapp' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="message-square" className="w-4 h-4"></i> 10. Integrasi WhatsApp
                        </button>
                      </div>

                      {/* Section 5: Pengaturan Sistem */}
                      <div>
                        <p className="text-[10px] font-bold text-slate-500 uppercase px-2 mb-1">Pengaturan Sistem</p>
                        <button onClick={() => navigateAdmin('registrations')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'registrations' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="user-plus" className="w-4 h-4"></i> 11. Pendaftaran Warga
                        </button>
                        <button onClick={() => navigateAdmin('registration-links')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'registration-links' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="link" className="w-4 h-4"></i> 12. Link Pendaftaran
                        </button>
                        <button onClick={() => navigateAdmin('users')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'users' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="key-round" className="w-4 h-4"></i> 13. Pengguna & Hak Akses
                        </button>
                        <button onClick={() => navigateAdmin('audit')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'audit' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="shield" className="w-4 h-4"></i> 14. Audit Log
                        </button>
                        <button onClick={() => navigateAdmin('license')} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-semibold transition text-left ${adminPage === 'license' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                          <i data-lucide="check-circle-2" className="w-4 h-4"></i> 15. Lisensi Aplikasi
                        </button>
                      </div>

                    </div>

                    <div className="p-3 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400">
                      <p className="font-semibold text-white">Pak Budi (Bendahara)</p>
                      <p className="text-[10px] text-slate-500">Sesi Login Terverifikasi</p>
                    </div>
                  </aside>

                  {/* Backdrop Overlay Mobile */}
                  {mobileMenuOpen && (
                    <div onClick={() => setMobileMenuOpen(false)} className="fixed inset-0 bg-slate-950/60 z-10 lg:hidden"></div>
                  )}

                  {/* MAIN CONTENT AREA */}
                  <main className="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
                    
                    {/* Top Search Bar */}
                    <div className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 flex-shrink-0">
                      <div className="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl w-48 sm:w-72 text-xs">
                        <i data-lucide="search" className="w-4 h-4 text-slate-400"></i>
                        <input type="text" placeholder="Cari data..." className="bg-transparent focus:outline-none w-full" />
                      </div>
                      <div className="flex items-center gap-3 text-xs">
                        <button onClick={() => showToast('Notifikasi')} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl relative text-slate-600">
                          <i data-lucide="bell" className="w-4 h-4"></i>
                          <span className="w-2 h-2 bg-rose-500 rounded-full absolute top-1 right-1"></span>
                        </button>
                        <span className="font-bold text-slate-700 hidden sm:inline">Portal Admin RT 05</span>
                      </div>
                    </div>

                    {/* DYNAMIC PAGE CONTENT */}
                    <div className="p-4 sm:p-6 space-y-6">
                      
                      {/* MENU 3: BILLING & TAGIHAN */}
                      {adminPage === 'billing' && (
                        <div className="space-y-6">
                          <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                            <div>
                              <h1 className="text-lg sm:text-xl font-bold text-slate-800">3. Pengaturan Iuran & Tagihan</h1>
                              <p className="text-xs text-slate-500">Kelola jenis iuran, buat tarif baru, dan terbitkan tagihan warga.</p>
                            </div>
                            <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                              <button onClick={() => setShowAddIuranModal(true)} className="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow-sm">
                                <i data-lucide="plus" className="w-4 h-4"></i> Tambah Jenis Iuran
                              </button>
                              <button onClick={() => showToast('Tagihan Bulanan Oktober Di-generate!')} className="flex-1 sm:flex-initial bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-3.5 py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow-sm">
                                <i data-lucide="zap" className="w-4 h-4"></i> Generate Tagihan Bulanan
                              </button>
                            </div>
                          </div>

                          <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4 text-xs">
                            <h3 className="font-bold text-slate-800 text-sm border-b pb-2 flex items-center gap-2">
                              <i data-lucide="file-plus" className="w-4 h-4 text-emerald-600"></i> Form Terbitkan Tagihan Baru
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4">
                              <div className="space-y-1">
                                <label className="font-bold text-slate-700">Pilih Jenis Iuran / Tarif</label>
                                <select className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800">
                                  <option>Iuran Keamanan & Kebersihan (Rp 75.000)</option>
                                  <option>Kas Rutin RT (Rp 50.000)</option>
                                </select>
                              </div>
                              <div className="space-y-1">
                                <label className="font-bold text-slate-700">Periode Tagihan</label>
                                <input type="month" defaultValue="2026-10" className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800" />
                              </div>
                              <div className="space-y-1">
                                <label className="font-bold text-slate-700">Target Warga</label>
                                <select className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-medium text-slate-800">
                                  <option>Seluruh Warga Aktif (78 Rumah)</option>
                                </select>
                              </div>
                            </div>
                            <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 pt-2 border-t">
                              <p className="text-[11px] text-amber-700 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200">
                                ⚠️ Pencegahan tagihan ganda periode yang sama aktif.
                              </p>
                              <button onClick={() => showToast('Tagihan berhasil diterbitkan!')} className="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl shadow-sm text-center">
                                🚀 Terbitkan Tagihan Sekarang
                              </button>
                            </div>
                          </div>

                          <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 className="font-bold text-slate-800 text-sm border-b pb-2">Jenis Iuran Terdaftar:</h3>
                            <div className="space-y-3">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-200 text-xs gap-3">
                                <div>
                                  <p className="font-bold text-slate-800 text-sm">Iuran Keamanan & Kebersihan</p>
                                  <p className="text-[11px] text-slate-500">Rutin Bulanan | Rp 75.000 / Bulan</p>
                                </div>
                                <div className="flex gap-1">
                                  <button onClick={() => showToast('Edit Iuran')} className="px-2.5 py-1 bg-white border text-slate-700 font-bold rounded-lg text-[11px]">Edit</button>
                                  <button onClick={() => showToast('Nonaktifkan Iuran')} className="px-2.5 py-1 bg-rose-50 text-rose-700 font-bold rounded-lg text-[11px]">Nonaktifkan</button>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* MENU 1: DASHBOARD */}
                      {adminPage === 'dashboard' && (
                        <div className="space-y-4">
                          <h1 className="text-xl font-bold text-slate-800">1. Dashboard Utama</h1>
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                              <p className="text-slate-500">Total Saldo Kas RT</p>
                              <p className="text-xl font-black text-slate-800">Rp 24.850.000</p>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* MENU FALLBACK UNTUK MENU LAINNYA */}
                      {!['billing', 'dashboard'].includes(adminPage) && (
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-xs space-y-2">
                          <span className="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full">Menu Active: {adminPage}</span>
                          <h2 className="text-base font-bold text-slate-800 capitalize mt-2">Halaman Menu {adminPage}</h2>
                          <p className="text-slate-500">Seluruh 15 menu admin terintegrasi penuh dalam alur navigasi ini.</p>
                        </div>
                      )}

                    </div>
                  </main>

                </div>

              </div>
            )}

            {/* PORTAL WARGA (PWA FRAME) */}
            {viewMode === 'pwa' && (
              <div className="w-[350px] mx-auto bg-slate-900 rounded-[42px] p-3 shadow-2xl border-4 border-slate-800 flex flex-col justify-between flex-shrink-0 relative">
                <div className="absolute top-5 left-1/2 -translate-x-1/2 w-28 h-4 bg-slate-950 rounded-full z-30 flex items-center justify-end px-2">
                  <div className="w-2.5 h-2.5 rounded-full bg-indigo-950 border border-indigo-500/30"></div>
                </div>

                <div className="w-full h-[630px] bg-slate-100 rounded-[32px] overflow-hidden flex flex-col pt-6 text-slate-800 relative font-sans shadow-inner">
                  <div className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shadow-md">
                    <div>
                      <h3 className="text-xs font-bold leading-tight">Kas Warga PWA</h3>
                      <p className="text-[9px] text-emerald-400 font-semibold">Portal Warga RT 05</p>
                    </div>
                    <div className="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-xs">BS</div>
                  </div>

                  <div className="flex-1 overflow-y-auto p-3.5 space-y-3.5 text-xs">
                    <h3 className="font-bold text-slate-800">Tagihan & Iuran Saya</h3>
                    <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl space-y-2">
                      <p className="text-xs font-bold text-amber-950">Iuran Kebersihan & Security</p>
                      <p className="text-sm font-black text-slate-900">Rp 75.000</p>
                      <button onClick={() => showToast('Upload Resi')} className="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl">Upload Resi</button>
                    </div>
                  </div>

                  <div className="h-14 bg-white border-t border-slate-200 flex items-center justify-around text-slate-400 text-[10px]">
                    <button onClick={() => setPwaPage('beranda')} className="flex flex-col items-center gap-0.5"><i data-lucide="home" className="w-4 h-4"></i> Beranda</button>
                    <button onClick={() => setPwaPage('tagihan')} className="flex flex-col items-center gap-0.5 text-emerald-600 font-bold"><i data-lucide="file-text" className="w-4 h-4"></i> Tagihan</button>
                    <button onClick={() => showToast('Profil')} className="flex flex-col items-center gap-0.5"><i data-lucide="user" className="w-4 h-4"></i> Profil</button>
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* Modal Pop-up: Tambah Jenis Iuran */}
          {showAddIuranModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-sm">Buat / Tambah Jenis Iuran Baru</h3>
                  <button onClick={() => setShowAddIuranModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                
                <div className="p-5 space-y-3.5 text-xs">
                  <div className="space-y-1">
                    <label className="font-bold text-slate-700">Nama Jenis Iuran</label>
                    <input type="text" placeholder="Contoh: Sumbangan Duka Cita / PHBN" className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500" />
                  </div>

                  <div className="space-y-1">
                    <label className="font-bold text-slate-700">Sifat Iuran</label>
                    <select className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500">
                      <option>Rutin Bulanan</option>
                      <option>Insidental / Khusus</option>
                    </select>
                  </div>

                  <div className="space-y-1">
                    <label className="font-bold text-slate-700">Nominal Default (Rp)</label>
                    <input type="number" placeholder="50000" className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500" />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      onClick={() => {
                        setShowAddIuranModal(false);
                        showToast('Jenis Iuran Baru Berhasil Ditambahkan!');
                      }} 
                      className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl">
                      Simpan Jenis Iuran
                    </button>
                    <button 
                      onClick={() => setShowAddIuranModal(false)} 
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-xl">
                      Batal
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
